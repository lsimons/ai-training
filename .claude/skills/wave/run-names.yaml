# Names for dispatcher runs (/wave, #353), like hurricane names: the next
# run takes the letter after the newest run's name, so the names sort in
# the order the runs started. After Z the letters start again at A in the
# second list, and after its Z at A in the first. One name per letter,
# each easy to spell and to say. A run is never named after a machine.
# site/scripts/lib/run-names.mjs picks the name, and its test checks this
# file.
