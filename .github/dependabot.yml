# Dependabot version updates - generates PRs for outdated dependencies.
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configure-version-updates
version: 2
updates:
  # Astro Starlight site dependencies (bun lockfile in site/)
  - package-ecosystem: "bun"
    directory: "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    ignore:
      # stay on typescript 6.x: @astrojs/check requires ^5 || ^6
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Python dev tools (ruff, basedpyright, pytest) pinned in uv.lock. "uv" is
  # the ecosystem that understands uv.lock; "pip" reads only pyproject.toml
  # and would leave the lock file stale. The ruff-pre-commit rev in
  # prek.toml is not a dependabot ecosystem, so a ruff bump here still needs
  # the manual rev move that AGENTS.md describes.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
