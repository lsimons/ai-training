# The project's copy of ai-tells.FormalTransitions (tbhb/vale-ai-tells
# v1.37.0, MIT), with two changes. "For example" is dropped: it is what
# Google.Latin prescribes over "e.g.", and the maintainer is fine with it.
# And the match is case-sensitive, so only the capitalized, sentence-initial
# form fires ("Notably, ...", "Hence ..."); the mid-sentence "and thus" or
# "similarly sized" is not the tell. Decided in docs/prose/README.md.
extends: existence
message: "Sentence-initial transition: '%s'. Delete it, or join with 'and', 'but', or 'so'."
level: warning
tokens:
  - Moreover
  - Furthermore
  - Additionally
  - Consequently
  - Subsequently
  - Nevertheless
  - Nonetheless
  - Conversely
  - Accordingly
  - Hence
  - Thus
  - Therefore
  - Thereby
  - Henceforth
  - Likewise
  - Similarly
  - In addition
  - In contrast
  - On the contrary
  - By contrast
  - As a result
  - For instance
  - In particular
  - 'Specifically(?=,)'
  - Notably
  - Importantly
  - 'Significantly(?=,)'
  - Crucially
  - 'Essentially(?=,)'
  - 'Fundamentally(?=,)'
  - With that in mind
  - With this in mind
  - To that end
  - In turn
  - Building on this
  - Building on that
  - That's why
  - This is why
  - Which is why
  - That's because
