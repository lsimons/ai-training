# The project's copy of ai-tells.VerbTricolon (tbhb/vale-ai-tells v1.37.0,
# MIT) without the after-colon tokens. In this repository a colon introduces
# a list of nouns far more often than a series of verbs, and 58 of the
# package rule's 95 hits were those noun lists, or the first three items of
# a longer list. What stays are the tokens that key on a verb form: a
# gerund, a past tense, a base form after a modal, a pronoun subject or
# "to". The third-person -s tokens went too: "its content, its knowledge
# model, and its learners" is three possessives, not three verbs, and nouns
# end in -s as often as verbs do. "It" joins the pronoun subjects so "it
# reads files, edits them, and runs commands" still fires. Decided in
# docs/prose/README.md. Each space in a pattern is `\s`, so a series split
# by a line break still matches (issue #371, scripts/vale_linebreaks.py).
extends: existence
message: "Tricolon: '%s'. Three parallel verbs in series. Restructure or vary the count."
level: warning
nonword: true
tokens:
  # Syndetic: "verbing X, verbing Y, and/or verbing Z"
  - "\\b(?:\\w+ly\\s)?\\w+ing\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+ing\\s[^,.!?]+,\\s(?:and|or)\\s(?:\\w+ly\\s)?\\w+ing\\s[^.!?]+"
  - "\\b(?:\\w+ly\\s)?\\w+ed\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+ed\\s[^,.!?]+,\\s(?:and|or)\\s(?:\\w+ly\\s)?\\w+ed\\s[^.!?]+"
  - "\\b(?:can|could|will|would|should|shall|may|might|must)\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\s(?:and|or)\\s(?:\\w+ly\\s)?\\w+\\s[^.!?]+"
  - "\\b(?:[Ii]t|[Tt]hey|[Ww]e|[Yy]ou)\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\s(?:and|or)\\s(?:\\w+ly\\s)?\\w+\\s[^.!?]+"
  - "\\bto\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\s(?:and|or)\\s(?:\\w+ly\\s)?\\w+\\s[^.!?]+"
  - "\\bto\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\sto\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\s(?:and|or)\\sto\\s(?:\\w+ly\\s)?\\w+\\s[^.!?]+"
  # Asyndetic: no conjunction before the third item
  - "\\b(?:\\w+ly\\s)?\\w+ing\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+ing\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+ing\\s[^,.!?]+"
  - "\\b(?:\\w+ly\\s)?\\w+ed\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+ed\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+ed\\s[^,.!?]+"
  - "\\b(?:can|could|will|would|should|shall|may|might|must)\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+"
  - "\\b(?:[Ii]t|[Tt]hey|[Ww]e|[Yy]ou)\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+,\\s(?:\\w+ly\\s)?\\w+\\s[^,.!?]+"
  # Subject-verb: "the X verbs A, the Y verbs B, and the Z verbs C"
  - "\\b[Tt]he\\s(?:\\w+\\s){1,3}\\w+s\\s[^,.!?]+,\\sthe\\s(?:\\w+\\s){1,3}\\w+s\\s[^,.!?]+,\\s(?:and|or)\\sthe\\s(?:\\w+\\s){1,3}\\w+s\\s[^.!?]+"
