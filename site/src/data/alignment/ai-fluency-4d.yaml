id: ai-fluency-4d
framework: AI Fluency 4D (Dakan and Feller)
rows:
  - code: Discernment
    asks: Judge the output, the process and the behavior of the AI critically
    objectives:
      - concepts/explains-models/names-failure-modes
      - safety/verifies-output/checks-claims
      - safety/verifies-output/spots-sycophancy
      - safety/verifies-output/calibrates-trust
      - using-agents/delegates-and-checks/reviews-against-brief
      - coding-with-agents/verifies-agent-work/reviews-others-code
  - code: Description
    asks: State the goal, context and wanted output clearly, and refine it
    objectives:
      - concepts/prompts-reliably/structures-a-prompt
      - concepts/prompts-reliably/iterates-on-output
      - concepts/prompts-reliably/asks-for-structure
      - using-agents/delegates-and-checks/writes-a-brief
      - using-agents/delegates-and-checks/adjusts-mid-task
      - coding-with-agents/ships-with-agent/gives-the-right-context
  - code: Delegation
    asks: Decide what to hand to AI, which tool fits, and how much autonomy to give
    objectives:
      - concepts/recognizes-agents/places-on-autonomy-scale
      - using-agents/chooses-tool-and-autonomy/picks-chat-agent-or-automation
      - using-agents/chooses-tool-and-autonomy/keeps-the-human-steps
      - using-agents/chooses-tool-and-autonomy/picks-a-model-by-fit
      - using-agents/delegates-and-checks/chooses-autonomy
      - coding-with-agents/specifies-work/judges-worth-building
  - code: Diligence
    asks: Use AI responsibly, transparently and with accountability for the result
    objectives:
      - safety/handles-data-safely/decides-what-to-share
      - safety/handles-data-safely/discloses-ai-use
      - safety/handles-data-safely/respects-licenses
      - safety/judges-agent-risk/names-blast-radius
      - safety/judges-agent-risk/chooses-human-in-loop
      - coding-with-agents/works-in-team/attributes-honestly
