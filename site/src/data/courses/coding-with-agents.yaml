# Course plan for the Coding with agents area (docs/agents/writing-a-lesson.md, "Course plan").
# One entry per lesson, in course order. Planned entries come from issue #33.
#
# The schema is strict (id, title, covers, serves, status, issue, minutes, after), so the
# per-lesson details that issue #33 asks for sit in comments directly under each entry, in
# this fixed order:
#   # mode: tutorial|explanation
#   # exercise (do|judge): <one line>
#   # shorts: <names the lesson would link to for depth, or none>
#   # assumes (other areas): <topic or objective ids from other areas, or none>
#   # introduces: <concept ids from the covered topic first taught here>
# `after` names lesson ids in this plan only. Cross-area prerequisites go in the `assumes`
# comment as topic or objective ids, because the other plans are being written in parallel and
# their lesson ids are not settled. The per-lesson issues created after merge carry the details
# formally, and their numbers go into `issue` then.
#
# Order follows the prerequisite edges in spec S02: first-session, then specification, then
# workflow, then context, then verification, quality and team. Two first-session lessons sit
# late on purpose: sandboxing (issue #18, low priority) and red-teaming your own agent, which
# needs a sandbox where nothing real can be damaged.
area: coding-with-agents
lessons:
  - id: coding-with-agents/first-session
    title: Your first session with a coding agent
    covers: coding-with-agents/first-session
    serves:
      - coding-with-agents/ships-with-agent/runs-a-session
      - coding-with-agents/ships-with-agent/gives-the-right-context
    status: live
    minutes: 25
    # mode: tutorial
    # exercise (do): a scripted change in the fixture repository, reviewed the same way
    # shorts: permission modes (S02 worked example), directed compaction and rewind
    # assumes (other areas): using-agents/delegates-and-checks/writes-a-brief, safety/judges-agent-risk/names-blast-radius
    # introduces: install-and-setup, codebase-understanding, first-change, permissions, session-and-context
    # Issue #94 adds a permission modes section and checkpoint to this page. It is a section of
    # this live lesson, so it gets no entry of its own.
  - id: coding-with-agents/keys-and-secrets
    title: Keeping API keys out of the agent's reach
    covers: coding-with-agents/first-session
    serves:
      - coding-with-agents/ships-with-agent/runs-a-session
    status: planned
    issue: 144
    minutes: 10
    after:
      - coding-with-agents/first-session
    # mode: tutorial
    # exercise (do): move the fixture agent's key from its settings file to an environment variable read from a password manager, then run a secret scanner over the fixture and the transcript
    # shorts: revoking a key on suspicion
    # assumes (other areas): safety/handles-data-safely/decides-what-to-share
    # introduces: secrets-hygiene
    # Closes the "API key hygiene" gap from issue #13: personal key, never committed, in a
    # password manager or environment variable, revoke on suspicion. Placed second because the
    # learner needs a key on day one. The agent-side settings hygiene from the #18 brief (lock the
    # settings file, key helper instead of a stored key) is taught here, and the sandboxing lesson
    # below takes the isolation part.
