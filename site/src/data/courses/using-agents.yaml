# Course plan for the Using agents area (docs/agents/writing-a-lesson.md, "Course plan").
# One entry per lesson, in course order. Planned entries come from issue #32.
#
# The schema is strict, so the per-lesson details from issue #32 sit in comments
# directly under each entry, always in this order:
#   mode, exercise (do|judge), shorts, assumes (other areas), introduces.
# `after` names lesson ids in this plan. Cross-area prerequisites are topic or
# objective ids in the `assumes (other areas)` comment, because the other area
# plans are being written at the same time and their lesson ids are not settled.
# `introduces` names the concept ids (from site/src/data/topics/using-agents/)
# that a lesson teaches first. Every concept in the area appears once.
# This is a Foundations course. No lesson needs programming or agent configuration.
area: using-agents
lessons:
  # Topic using-agents/assistant-work (five concepts, four lessons). Each lesson is
  # one everyday use with its own run, so each stays a short tutorial.
  - id: using-agents/finding-information
    title: Finding information with an assistant
    covers: using-agents/assistant-work
    serves:
      - using-agents/delegates-and-checks/writes-a-brief
    status: planned
    minutes: 15
    # mode: tutorial
    # exercise (do): paste a supplied two-page text, ask for the three things a newcomer must know with a quote for each, then check every quote against the text and note which one is not there.
    # shorts: Asking for sources
    # assumes (other areas): concepts/prompting, concepts/explains-models/names-failure-modes
    # introduces: finding-information
  - id: using-agents/working-from-files
    title: Working from your own files and images
    covers: using-agents/assistant-work
    serves:
      - using-agents/delegates-and-checks/writes-a-brief
    status: planned
    minutes: 10
    after:
      - using-agents/finding-information
    # mode: tutorial
    # exercise (do): upload a supplied screenshot of a table, ask for it as rows you can paste into a spreadsheet, and count the cells that came back wrong.
    # shorts: What an upload discloses
    # assumes (other areas): safety/handles-data-safely/decides-what-to-share
    # introduces: working-with-files-and-images
  - id: using-agents/thought-partner
    title: Thinking a problem through with an assistant
    covers: using-agents/assistant-work
    serves:
      - using-agents/delegates-and-checks/writes-a-brief
    status: planned
    minutes: 10
    # mode: tutorial
    # exercise (do): describe a decision you face in five lines, ask the assistant to argue against your preferred option and to list what you have not mentioned, then write down the one point that changed your view.
    # shorts: Why a model agrees with your framing
    # assumes (other areas): concepts/prompting, safety/verifies-output/spots-sycophancy
    # introduces: thought-partner
  - id: using-agents/drafting-and-critique
    title: Drafting a text and asking for critique
    covers: using-agents/assistant-work
    serves:
      - using-agents/delegates-and-checks/writes-a-brief
      - using-agents/delegates-and-checks/reviews-against-brief
    status: planned
    minutes: 15
    after:
      - using-agents/thought-partner
    # mode: tutorial
    # exercise (do): brief the assistant for a short email (audience, purpose, two points that must appear, tone), then hand the draft back as "a colleague's text" with three stated criteria and ask for problems only. Compare the two answers.
    # shorts: Grading against stated criteria
    # assumes (other areas): concepts/prompts-reliably/structures-a-prompt, safety/verifies-output/spots-sycophancy
    # introduces: drafting, critique
  # Topic using-agents/delegating (four concepts, three lessons). The live tutorial
  # teaches all four concepts. The two planned lessons add the explanation side of
  # autonomy and the one objective the live lesson does not serve, adjusts-mid-task.
  - id: using-agents/delegating
    title: Delegating a task to an agent
    covers: using-agents/delegating
    serves:
      - using-agents/delegates-and-checks/writes-a-brief
      - using-agents/delegates-and-checks/chooses-autonomy
      - using-agents/delegates-and-checks/reviews-against-brief
    status: live
    minutes: 20
    # mode: tutorial
    # exercise (do): delegate the memo summary from the lesson with a brief, then walk the done-criteria one by one.
    # shorts: Done-criteria before the work
    # assumes (other areas): concepts/what-is-an-agent, safety/verification, concepts/explains-models/explains-generation
    # introduces: task-brief, giving-context, choosing-a-degree-of-autonomy, checking-results
  - id: using-agents/choosing-autonomy
    title: How much the agent may do before it asks
    covers: using-agents/delegating
    serves:
      - using-agents/delegates-and-checks/chooses-autonomy
    status: planned
    minutes: 10
    after:
      - using-agents/delegating
    # mode: explanation
    # exercise (judge): sort six supplied tasks into draft only, ask before anything irreversible, or run to completion, and write the one-sentence boundary for two of them.
    # shorts: Trust earned by results
    # assumes (other areas): concepts/recognizes-agents/places-on-autonomy-scale, safety/judges-agent-risk/names-blast-radius
    # introduces: none (deepens choosing-a-degree-of-autonomy from the live lesson)
  - id: using-agents/adjusting-the-brief
    title: Changing the brief while the agent works
    covers: using-agents/delegating
    serves:
      - using-agents/delegates-and-checks/adjusts-mid-task
    status: planned
    minutes: 15
    after:
      - using-agents/delegating
    # mode: tutorial
    # exercise (do): run the lesson's brief, which is written so the agent must ask a question, answer it by editing the brief instead of the chat, restart from the edited brief, and compare the two results.
    # shorts: Why an answer in the chat is lost
    # assumes (other areas): concepts/prompts-reliably/iterates-on-output, concepts/how-models-work
    # introduces: none (deepens task-brief and checking-results from the live lesson)
  # Topic using-agents/decomposition (three concepts, three lessons). Two tutorials
  # that run, one explanation that judges.
  - id: using-agents/breaking-work-into-pieces
    title: Breaking a task into pieces an agent can finish
    covers: using-agents/decomposition
    serves:
      - using-agents/delegates-and-checks/writes-a-brief
    status: planned
    minutes: 15
    after:
      - using-agents/delegating
    # mode: tutorial
    # exercise (do): take the supplied large task (a three-part report from three source files), split it into pieces that each have an input, an output and a check, and write the brief for the first piece.
    # shorts: The decisions that are yours to make first
    # assumes (other areas): none
    # introduces: task-decomposition
  - id: using-agents/delegating-in-rounds
    title: Delegating in rounds
    covers: using-agents/decomposition
    serves:
      - using-agents/delegates-and-checks/adjusts-mid-task
      - using-agents/delegates-and-checks/reviews-against-brief
    status: planned
    minutes: 15
    after:
      - using-agents/breaking-work-into-pieces
      - using-agents/adjusting-the-brief
    # mode: tutorial
    # exercise (do): delegate the first piece from the previous lesson, check it against its criteria, change the brief with what the result showed, and delegate the second piece. Keep a two-line log per round.
    # shorts: Keeping rounds short
    # assumes (other areas): safety/verifies-output/keeps-a-check-habit
    # introduces: task-iteration
  - id: using-agents/when-to-stop
    title: When to stop delegating and do it yourself
    covers: using-agents/decomposition
    serves:
      - using-agents/chooses-tool-and-autonomy/picks-chat-agent-or-automation
    status: planned
    minutes: 10
    after:
      - using-agents/delegating-in-rounds
    # mode: explanation
    # exercise (judge): read three supplied round logs and mark, for each, the round where taking the step back would have been cheaper, with the sign that shows it.
    # shorts: The third round
    # assumes (other areas): none
    # introduces: when-to-stop-and-do-it-yourself
  # Topic using-agents/choosing-tools (five concepts, four lessons). One tutorial
  # that runs a comparison, three explanations that judge. The last lesson serves
  # the area's one expert objective and stays separate for that reason.
  - id: using-agents/chat-agent-or-automation
    title: Chat, agent or automation
    covers: using-agents/choosing-tools
    serves:
      - using-agents/chooses-tool-and-autonomy/picks-chat-agent-or-automation
      - using-agents/delegates-and-checks/chooses-autonomy
    status: planned
    minutes: 15
    after:
      - using-agents/choosing-autonomy
    # mode: explanation
    # exercise (judge): for five supplied tasks, pick chat, agent or automation for the task's worst case, and write what would move each one level up and what would move it back.
    # shorts: Picking for the tenth time
    # assumes (other areas): concepts/recognizes-agents/tells-agent-from-assistant, safety/judges-agent-risk/chooses-human-in-loop
    # introduces: chat-vs-agent-vs-automation
  - id: using-agents/trying-two-models
    title: Trying two models on the same task
    covers: using-agents/choosing-tools
    serves:
      - using-agents/chooses-tool-and-autonomy/picks-chat-agent-or-automation
    status: planned
    minutes: 15
    after:
      - using-agents/chat-agent-or-automation
    # mode: tutorial
    # exercise (do): run the same three supplied inputs (one reformatting, one classification, one ambiguous request) on a small and a large model from the picker in your chat tool, time each answer, and fill a six-cell table with good enough or not.
    # shorts: When a small model is the right one
    # assumes (other areas): concepts/limits, concepts/how-models-work
    # introduces: model-fit, cost-and-speed
  - id: using-agents/steps-that-stay-human
    title: The steps that stay human
    covers: using-agents/choosing-tools
    serves:
      - using-agents/chooses-tool-and-autonomy/keeps-the-human-steps
    status: planned
    minutes: 10
    after:
      - using-agents/chat-agent-or-automation
    # mode: explanation
    # exercise (judge): in a supplied eight-step process (hiring a contractor), mark the steps that stay with a person and give the reason per step, accountability, knowledge the agent cannot reach, or keeping your own judgment sharp.
    # shorts: A human path when the tool is down
    # assumes (other areas): safety/judges-agent-risk/chooses-human-in-loop, safety/governance
    # introduces: what-to-keep-human
  - id: using-agents/when-the-tool-climbs
    title: Asking the same questions one level up
    covers: using-agents/choosing-tools
    serves:
      - using-agents/chooses-tool-and-autonomy/reasons-across-levels
    status: planned
    minutes: 15
    after:
      - using-agents/steps-that-stay-human
      - using-agents/trying-two-models
    # mode: explanation
    # exercise (judge): for two supplied before-and-after pairs (a summary you wrote versus one an agent wrote, a folder you filed versus one an automation filed), name the check that stopped working and the check that replaces it.
    # shorts: Going down a level when the number looks round
    # assumes (other areas): concepts/limits, safety/verifies-output/calibrates-trust
    # introduces: reasoning-across-tool-levels
