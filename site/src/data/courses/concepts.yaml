# Course plan for the Concepts area (docs/agents/writing-a-lesson.md, "Course plan").
# One entry per lesson, in course order. Planned entries come from issue #30.
#
# The schema is strict, so the per-lesson details from issue #30 sit in comments
# under each entry, in this fixed order:
#   mode, exercise (do|judge), shorts, assumes (other areas), introduces.
# The per-lesson issues carry them formally once they exist. `after` names lesson
# ids in this plan only. Cross-area prerequisites go in `assumes (other areas)`
# as topic or objective ids. The Concepts area has no cross-area prerequisites,
# so that line reads `none` throughout.
#
# Order follows the prerequisite edges in spec S02: how-models-work, then
# prompting and limits, then what-is-an-agent, then grounding.
area: concepts
lessons:
  # --- concepts/how-models-work (five concepts: two lessons here, model-family-and-size in concepts/what-tokens-cost) ---
  - id: concepts/how-models-work
    title: How a language model works
    covers: concepts/how-models-work
    serves:
      - concepts/explains-models/explains-generation
      - concepts/explains-models/names-failure-modes
    status: live
    minutes: 20
    # mode: explanation
    # exercise (judge): ask the same question twice, read both answers, and explain the difference in terms of sampling
    # shorts: none
    # assumes (other areas): none
    # introduces: token, training-vs-inference, sampling-and-temperature, hallucination, knowledge-cutoff (names context-window, non-determinism and sycophancy in passing; the lessons below teach them)
  - id: concepts/context-window
    title: What the model can see
    covers: concepts/how-models-work
    serves:
      - concepts/explains-models/explains-generation
    status: live
    minutes: 12
    after:
      - concepts/how-models-work
    # mode: tutorial
    # exercise (do): count the tokens of a page of your own text with the fixture, then work out how many such pages fill a window of a given size
    # shorts: how a tokenizer splits text (why letter counting fails)
    # assumes (other areas): none
    # introduces: context-window

  # --- concepts/prompting (five concepts, tutorial side: five lessons) ---
  - id: concepts/prompt-anatomy
    title: Instruction, context and format
    covers: concepts/prompting
    serves:
      - concepts/prompts-reliably/structures-a-prompt
    status: live
    minutes: 15
    after:
      - concepts/how-models-work
    # mode: tutorial
    # exercise (do): rewrite a one-line request into instruction, marked context, audience and format, and run both versions in a chat
    # shorts: delimiters and why they matter
    # assumes (other areas): none
    # introduces: instruction
  - id: concepts/one-example
    title: Show one example
    covers: concepts/prompting
    serves:
      - concepts/prompts-reliably/structures-a-prompt
    status: planned
    issue: 121
    minutes: 12
    after:
      - concepts/prompt-anatomy
    # mode: tutorial
    # exercise (do): replace a paragraph of formatting rules with one worked example and compare the two outputs
    # shorts: when an example teaches the wrong thing
    # assumes (other areas): none
    # introduces: few-shot-example
  - id: concepts/structured-output
    title: Output the next step can use
    covers: concepts/prompting
    serves:
      - concepts/prompts-reliably/asks-for-structure
    status: planned
    issue: 123
    minutes: 12
    after:
      - concepts/prompt-anatomy
    # mode: tutorial
    # exercise (do): ask for named fields with allowed values, paste the result into the fixture that checks it, and fix the prompt until it passes
    # shorts: none
    # assumes (other areas): none
    # introduces: structured-output
  - id: concepts/system-prompt
    title: The prompt before the conversation
    covers: concepts/prompting
    serves:
      - concepts/prompts-reliably/structures-a-prompt
    status: planned
    issue: 125
    minutes: 10
    after:
      - concepts/prompt-anatomy
    # mode: explanation
    # exercise (judge): read two short system prompts and predict, for three user messages, how the answers differ
    # shorts: none
    # assumes (other areas): none
    # introduces: role-and-system-prompt
  - id: concepts/iterating-on-a-prompt
    title: Change the prompt before you retry
    covers: concepts/prompting
    serves:
      - concepts/prompts-reliably/iterates-on-output
    status: planned
    issue: 127
    minutes: 15
    after:
      - concepts/structured-output
    # mode: tutorial
    # exercise (do): take a summary prompt through three rounds, changing one thing per round, and keep a three-line log of what each change fixed
    # shorts: keeping a prompt template
    # assumes (other areas): none
    # introduces: iteration

  # --- concepts/limits (six concepts: four lessons) ---
  - id: concepts/thin-path
    title: Where a model makes things up
    covers: concepts/limits
    serves:
      - concepts/explains-models/names-failure-modes
    status: planned
    issue: 129
    minutes: 15
    after:
      - concepts/how-models-work
    # mode: explanation
    # exercise (judge): for five tasks, decide whether to spot-check or to verify every specific, and for one wrong answer name the two properties that met to produce it
    # shorts: checking a citation
    # assumes (other areas): none
    # introduces: none. Deepens hallucination and knowledge-cutoff, which the live lesson introduces and grades. This lesson adds where fabrication concentrates (specifics, rare topics, recent events) and how much checking a task calls for. Issue #86 decides whether the task-placing checkpoint goes in the live lesson or here; this entry stands either way.
  - id: concepts/same-prompt-twice
    title: Same prompt, different answer
    covers: concepts/limits
    serves:
      - concepts/explains-models/explains-generation
      - concepts/explains-models/names-failure-modes
    status: planned
    issue: 131
    minutes: 12
    after:
      - concepts/how-models-work
    # mode: tutorial
    # exercise (do): run the sampling fixture ten times at two temperatures, tabulate how often the answers agree, and write the check a workflow would need to accept that variation
    # shorts: none
    # assumes (other areas): none
    # introduces: non-determinism. The live lesson shows that two runs differ and why. This lesson adds the consequence for a process: one good run proves nothing about a prompt, variation remains at the lowest temperature, and any workflow built on a model needs a check that tolerates it.
  - id: concepts/straight-answer
    title: Getting a straight answer
    covers: concepts/limits
    serves:
      - concepts/explains-models/names-failure-modes
    status: planned
    issue: 134
    minutes: 12
    after:
      - concepts/thin-path
    # mode: tutorial
    # exercise (do): ask a leading and a neutral question about the same plan, then ask for the strongest objections, and compare the three answers
    # shorts: none
    # assumes (other areas): none
    # introduces: sycophancy
  - id: concepts/what-tokens-cost
    title: What every token costs
    covers: concepts/limits
    serves:
      - concepts/explains-models/explains-generation
    status: planned
    issue: 137
    minutes: 15
    after:
      - concepts/context-window
    # mode: tutorial
    # exercise (do): price a long prompt and a short one with the token counter and a price table for a small and a large model, then find the rule that a long instruction file buried
    # shorts: why long instruction files fail
    # assumes (other areas): none
    # introduces: model-family-and-size, cost-and-latency, instruction-dilution. Dilution here is about one instruction competing with the text after it, in one prompt or file. Context rot (concepts/memory) is the session-level effect of a filling window.

  # --- concepts/what-is-an-agent (five concepts: three lessons; hub for five topics in other areas) ---
  - id: concepts/agent-loop
    title: Run a tiny agent
    covers: concepts/what-is-an-agent
    serves:
      - concepts/recognizes-agents/names-the-loop
    status: planned
    issue: 140
    minutes: 15
    after:
      - concepts/iterating-on-a-prompt
      - concepts/thin-path
    # mode: tutorial
    # exercise (do): run the toy loop fixture (a scripted model with two tools), and list each turn as observe, think or act with the tool it used
    # shorts: how a tool is described to the model
    # assumes (other areas): none
    # introduces: tool, agent-loop
  - id: concepts/assistant-or-agent
    title: Assistant or agent?
    covers: concepts/what-is-an-agent
    serves:
      - concepts/recognizes-agents/tells-agent-from-assistant
    status: planned
    issue: 143
    minutes: 12
    after:
      - concepts/agent-loop
    # mode: explanation
    # exercise (judge): classify five product descriptions by what each can do without another prompt, and list the tools of the ones that are agents
    # shorts: none
    # assumes (other areas): none
    # introduces: model-vs-agent, harness
  - id: concepts/autonomy-scale
    title: Who decides the next step
    covers: concepts/what-is-an-agent
    serves:
      - concepts/recognizes-agents/places-on-autonomy-scale
    status: planned
    issue: 146
    minutes: 12
    after:
      - concepts/assistant-or-agent
    # mode: explanation
    # exercise (judge): place one coding agent in three permission settings on the scale and say what moves each one step up or down
    # shorts: none
    # assumes (other areas): none
    # introduces: degree-of-autonomy

  # --- concepts/grounding (four concepts: two lessons) ---
  - id: concepts/retrieval
    title: Answers from documents the model never saw
    covers: concepts/grounding
    serves:
      - concepts/explains-models/explains-grounding
    status: planned
    issue: 149
    minutes: 15
    after:
      - concepts/agent-loop
    # mode: tutorial
    # exercise (do): search a small folder of policy texts with the retrieval fixture, ask a question in other words than the document uses, and record what the search missed
    # shorts: keyword search versus similarity search
    # assumes (other areas): none
    # introduces: retrieval-rag, grounding
  - id: concepts/memory
    title: Where memory comes from
    covers: concepts/grounding
    serves:
      - concepts/explains-models/explains-grounding
      - concepts/explains-models/explains-generation
    status: planned
    issue: 152
    minutes: 12
    after:
      - concepts/retrieval
      - concepts/what-tokens-cost
    # mode: explanation
    # exercise (judge): read a long transcript, mark where the answers start to drift, and say which of summarize, start fresh or retrieve would have helped
    # shorts: none
    # assumes (other areas): none
    # introduces: short-and-long-term-memory, context-rot. Context rot is the session-level decline as the window fills with old turns and tool output; concepts/what-tokens-cost covers instruction dilution inside one prompt or file.
