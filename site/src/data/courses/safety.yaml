# Course plan for the Safety area (docs/agents/writing-a-lesson.md, "Course plan").
# One entry per lesson, in course order. Planned entries come from issue #31.
#
# The collection schema is strict, so the per-lesson details the plan issue
# asks for sit in comments directly under each entry, in this order:
#   # mode: tutorial|explanation
#   # exercise (do|judge): one line
#   # shorts: names, or none
#   # assumes (other areas): topic or objective ids, or none
#   # introduces: concept ids first taught here
# `after` names lesson ids in this plan only. Cross-area prerequisites are in
# the `assumes (other areas)` comment, because the other plans are being
# written in parallel and their lesson ids are not settled.
#
# Order follows the prerequisite edges in spec S02: responsible-use and
# failure-modes need only concepts/limits, verification needs failure-modes,
# agent-risk needs verification and concepts/what-is-an-agent, and governance
# needs agent-risk. The EU AI Act lesson is last, per issue #19.
#
# Safety is a Foundations course for every knowledge worker. No lesson here
# requires running or configuring an agent. Tutorial-mode lessons run Python
# fixtures under site/examples/ through <Predict run=...>, or have the learner
# type prompts into a chat tool they already use.
area: safety
lessons:
  - id: safety/responsible-use
    title: What may go into an AI tool
    covers: safety/responsible-use
    serves:
      - safety/handles-data-safely/decides-what-to-share
      - safety/handles-data-safely/discloses-ai-use
      - safety/handles-data-safely/respects-licenses
    status: live
    minutes: 20
    # mode: explanation
    # exercise (do): Write down, for one tool you use, where a prompt goes: retention, training, region, subprocessors.
    # shorts: Residency at rest versus processing location; Web search sends a derived query; Enterprise tiers sell governance
    # assumes (other areas): concepts/explains-models/names-failure-modes
    # introduces: data-privacy, confidentiality, licensing-and-attribution, disclosure
  - id: safety/redact-before-you-paste
    title: Redacting a document before you paste it
    covers: safety/responsible-use
    serves:
      - safety/handles-data-safely/decides-what-to-share
    status: planned
    minutes: 15
    after:
      - safety/responsible-use
    # mode: tutorial
    # exercise (do): Redact a real document from your own work down to what the task needs, and keep the redaction map outside the tool.
    # shorts: Controller and processor in one page; Anonymized data can be re-identified
    # assumes (other areas): none
    # introduces: none (deepens data-privacy and confidentiality with a fixture that replaces names, contact details and account numbers with placeholders and shows the task still works on the result)
  - id: safety/saying-ai-helped
    title: Saying that AI helped, and crediting what it copied
    covers: safety/responsible-use
    serves:
      - safety/handles-data-safely/discloses-ai-use
      - safety/handles-data-safely/respects-licenses
    status: planned
    minutes: 15
    after:
      - safety/responsible-use
    # mode: tutorial
    # exercise (do): Write the disclosure line for three artifacts you produced this month, and for one of them find the rule of the place it went to.
    # shorts: Content credentials (C2PA); The license filter question for generated code
    # assumes (other areas): none
    # introduces: none (deepens disclosure and licensing-and-attribution with a fixture that compares a generated function with a known library source and reports the near-verbatim match)
  - id: safety/spotting-hallucination
    title: What an invented fact looks like
    covers: safety/failure-modes
    serves:
      - safety/verifies-output/checks-claims
    status: planned
    minutes: 15
    # mode: tutorial
    # exercise (do): Take one AI-written paragraph from your own work and mark every specific claim in it, then check the first three.
    # shorts: Why specificity is the tell
    # assumes (other areas): concepts/explains-models/names-failure-modes
    # introduces: hallucination-in-practice (a fixture checks a summary's citations, numbers and quotes against a small offline source set and prints which ones have no source)
  - id: safety/bias-in-patterns
    title: Seeing bias across many answers
    covers: safety/failure-modes
    serves:
      - safety/verifies-output/calibrates-trust
    status: planned
    minutes: 15
    after:
      - safety/spotting-hallucination
    # mode: tutorial
    # exercise (judge): For one task at your work where a model's output affects people, write down which groups you would compare and how many samples you need before you would trust a pattern.
    # shorts: Bias from training data and bias from tuning
    # assumes (other areas): concepts/explains-models/names-failure-modes
    # introduces: bias (a fixture ranks the same set of records under two swapped name lists and tallies the difference, so the slant is visible only in the totals)
  - id: safety/when-the-tool-is-usually-right
    title: When the tool is usually right
    covers: safety/failure-modes
    serves:
      - safety/verifies-output/calibrates-trust
    status: planned
    minutes: 10
    after:
      - safety/spotting-hallucination
    # mode: explanation
    # exercise (judge): Pick one task you have stopped checking, and write down what the last unchecked mistake would have cost and who would have found it.
    # shorts: Automation complacency in aviation and medicine
    # assumes (other areas): concepts/explains-models/names-failure-modes
    # introduces: overreliance, automation-complacency
  - id: safety/checking-habits
    title: Checking habits that run when you are in a hurry
    covers: safety/verification
    serves:
      - safety/verifies-output/checks-claims
      - safety/verifies-output/calibrates-trust
    status: planned
    minutes: 15
    after:
      - safety/spotting-hallucination
      - safety/when-the-tool-is-usually-right
    # mode: tutorial
    # exercise (do): Apply the four checks to one AI-written document from your week: read it against the request, find the claims you did not supply, open one link, redo one calculation.
    # shorts: none
    # assumes (other areas): none
    # introduces: checking-habits (a fixture recomputes the totals in a model-written summary table and flags the row that does not add up)
  - id: safety/following-the-source
    title: Following a claim back to its source
    covers: safety/verification
    serves:
      - safety/verifies-output/checks-claims
    status: planned
    minutes: 15
    after:
      - safety/checking-habits
    # mode: tutorial
    # exercise (do): Take three references from an AI-written text, open each, and record for each whether the source exists and says what the text claims.
    # shorts: Real title, invented finding
    # assumes (other areas): none
    # introduces: source-checking (a fixture resolves a list of citations against an offline bibliography and reports one that exists with a different finding and one that does not exist)
  - id: safety/asking-a-model-to-disagree
    title: Asking a model to disagree
    covers: safety/verification
    serves:
      - safety/verifies-output/spots-sycophancy
    status: planned
    minutes: 15
    after:
      - safety/checking-habits
    # mode: tutorial
    # exercise (do): Ask a model whether a plan of yours is good in three ways: leading, neutral, and asking for the strongest counter-argument first. Compare the three answers.
    # shorts: none
    # assumes (other areas): concepts/explains-models/names-failure-modes (sycophancy, as a limit of the model)
    # introduces: none (deepens checking-habits with prompts the learner types into their own chat tool, and recorded responses marked illustrative)
  - id: safety/marking-what-a-person-checked
    title: Marking what a person has checked
    covers: safety/verification
    serves:
      - safety/verifies-output/checks-claims
      - safety/verifies-output/keeps-a-check-habit
    status: planned
    minutes: 15
    after:
      - safety/following-the-source
    # mode: explanation
    # exercise (judge): Take a template your team uses for AI-assisted work and decide where a "checked by" field goes, how light it must be to get filled in, and how you would sample whether it is.
    # shorts: Endorsed answers in the CS50 tutor
    # assumes (other areas): none
    # introduces: endorsed-answers
  - id: safety/checking-what-an-agent-changed
    title: Checking what an agent changed
    covers: safety/verification
    serves:
      - safety/verifies-output/calibrates-trust
    status: planned
    minutes: 15
    after:
      - safety/checking-habits
    # mode: tutorial
    # exercise (do): For one agent task you have seen or read about, list the effects to inspect afterwards (files, messages, deletions) and the one step that needs a pause first.
    # shorts: none
    # assumes (other areas): concepts/recognizes-agents/tells-agent-from-assistant
    # introduces: trust-but-verify-for-agents (a fixture replays a recorded agent session as file changes and prints the before and after, so the learner checks effects against the request without running an agent)
  - id: safety/agent-risk
    title: Why agent safety is different
    covers: safety/agent-risk
    serves:
      - safety/judges-agent-risk/names-blast-radius
      - safety/judges-agent-risk/chooses-human-in-loop
      - safety/judges-agent-risk/recognizes-injection
    status: live
    minutes: 20
    # mode: explanation
    # exercise (do): Describe one agent task, list its reach, and place the approval before the irreversible step.
    # shorts: Agents that are only saved prompts; Permission modes (spec S02, extends-to)
    # assumes (other areas): concepts/explains-models/names-failure-modes, concepts/recognizes-agents/tells-agent-from-assistant
    # introduces: blast-radius, permissions-and-least-privilege, human-in-the-loop, prompt-injection, exfiltration
  - id: safety/sizing-the-blast-radius
    title: Sizing an agent's blast radius
    covers: safety/agent-risk
    serves:
      - safety/judges-agent-risk/names-blast-radius
      - safety/judges-agent-risk/chooses-human-in-loop
    status: planned
    minutes: 15
    after:
      - safety/agent-risk
      - safety/checking-what-an-agent-changed
    # mode: tutorial
    # exercise (do): Write the permission list for one agent task at your work as read, write and send rows, cross out what the task does not need, and mark the row where a person approves.
    # shorts: none
    # assumes (other areas): concepts/recognizes-agents/names-the-loop
    # introduces: none (deepens blast-radius, permissions-and-least-privilege and human-in-the-loop with a fixture that reads a permission list and prints what it reaches, who is affected and which actions cannot be undone)
  - id: safety/tracing-a-planted-instruction
    title: Tracing a planted instruction to the way out
    covers: safety/agent-risk
    serves:
      - safety/judges-agent-risk/recognizes-injection
    status: planned
    minutes: 15
    after:
      - safety/agent-risk
    # mode: tutorial
    # exercise (judge): For an assistant you use that reads mail, pages or files, name the outbound abilities it has and which one you would remove or gate for a summarizing task.
    # shorts: Why a model cannot tell data from commands
    # assumes (other areas): none
    # introduces: none (deepens prompt-injection and exfiltration with a fixture that simulates an agent reading a page with a planted line under three permission sets and prints, for each, whether data leaves and by which tool)
  - id: safety/writing-an-ai-policy
    title: Writing an AI policy a team can apply
    covers: safety/governance
    serves:
      - safety/judges-agent-risk/sets-oversight
    status: planned
    minutes: 15
    after:
      - safety/agent-risk
    # mode: tutorial
    # exercise (do): Fill in the one-page policy template for your own team: allowed tasks, data, approvals, and the escalation route with names.
    # shorts: Enterprise tiers sell governance; The eight questions for a vendor
    # assumes (other areas): none
    # introduces: policy, escalation
    # Paraphrase, in our own words, the framing from Academy deploying-claude-enterprise-with-confidence noted on issue #31: read access and write access as two levels of sign-off (start read-only, grant write per workflow with the risk owner's approval), and an agent inheriting the user's own permissions through a connector.
  - id: safety/reading-agent-logs
    title: Reading agent logs and rerunning after a model change
    covers: safety/governance
    serves:
      - safety/judges-agent-risk/sets-oversight
    status: planned
    minutes: 15
    after:
      - safety/writing-an-ai-policy
    # mode: tutorial
    # exercise (do): Take one agent or assistant your team uses and write down what it logs, where, who reads a sample, and what you would rerun after the vendor's next model update.
    # shorts: A model update as a dependency upgrade
    # assumes (other areas): none
    # introduces: logging-and-audit, model-change-risk (a fixture reads a recorded agent log and reconstructs what was asked, called and changed, then compares the same task set run under two model versions and prints the rows that differ)
    # Paraphrase, in our own words, the framing from Academy deploying-claude-enterprise-with-confidence noted on issue #31: an agent that leaves no audit trail is the wrong tool for a regulated workflow.
  - id: safety/assessing-a-use-case
    title: Assessing the risk of a use case before it starts
    covers: safety/governance
    serves:
      - safety/judges-agent-risk/sets-oversight
      - safety/judges-agent-risk/names-blast-radius
    status: planned
    minutes: 15
    after:
      - safety/writing-an-ai-policy
    # mode: tutorial
    # exercise (do): Assess one AI use case from your own work with the method: domains touched, impact and likelihood on the scales, the level, and who would have to accept it in writing.
    # shorts: none
    # assumes (other areas): none
    # introduces: risk-assessment (a fixture scores three use cases from their impact and likelihood ratings into a level and prints which ones cross the threshold)
  - id: safety/eu-ai-act
    title: The EU AI Act in one lesson
    covers: safety/governance
    serves:
      - safety/judges-agent-risk/sets-oversight
      - safety/handles-data-safely/discloses-ai-use
    status: planned
    issue: 19
    minutes: 15
    after:
      - safety/writing-an-ai-policy
      - safety/assessing-a-use-case
    # mode: explanation
    # exercise (judge): Sort six scenarios into the Regulation's risk tiers and decide provider or deployer for three of them, then say which duties touch your own daily work.
    # shorts: Content credentials (C2PA); Where the AI literacy duty comes from
    # assumes (other areas): none beyond the Concepts area, per the brief on issue #19
    # introduces: regulation
    # The AI literacy pointer that issue #10 asked for lands here, and the transparency duties connect back to disclosure in safety/responsible-use.
