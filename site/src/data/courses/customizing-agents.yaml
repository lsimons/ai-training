# Course plan for the Customizing agents area (docs/agents/writing-a-lesson.md, "Course plan").
# One entry per lesson, in course order. Planned entries come from issue #34.
#
# The schema is strict, so the per-lesson details the plan issue asks for
# are comments directly under each entry, in this fixed order:
#   # mode: tutorial|explanation
#   # exercise (do|judge): one line
#   # shorts: names, or none
#   # assumes (other areas): topic or objective ids, or none
#   # introduces: concept ids first taught here
# `after` holds lesson ids from this plan only. Cross-area prerequisites are
# in the `assumes (other areas)` comment, because the other plans are being
# written at the same time and their lesson ids are not settled.
#
# Order: instructions, skills, mcp, hooks-permissions, memory. That follows
# the prerequisite edges in spec S02: skills and mcp need instructions,
# hooks-permissions needs instructions and safety/agent-risk, memory needs
# skills. Memory comes last because its closing lesson sends repeated work
# into instructions, skills and hooks.
area: customizing-agents
lessons:
  # --- instructions ---------------------------------------------------------
  - id: customizing-agents/instructions
    title: "Project instructions: AGENTS.md"
    covers: customizing-agents/instructions
    serves:
      - customizing-agents/configures-agent/writes-project-instructions
    status: live
    minutes: 20
    # mode: tutorial
    # exercise (do): write the instruction file for the invoice-mailer fixture from a session transcript
    # shorts: none
    # assumes (other areas): coding-with-agents/ships-with-agent/gives-the-right-context
    # introduces: agents-md-claude-md, sections, monorepo-hierarchy, when-instructions-are-not-enough
  - id: customizing-agents/instructions-pruning
    title: Keeping the instruction file short
    covers: customizing-agents/instructions
    serves:
      - customizing-agents/configures-agent/writes-project-instructions
    status: planned
    minutes: 10
    after:
      - customizing-agents/instructions
    # mode: explanation
    # exercise (judge): take a generated first-draft instruction file of forty lines and mark each line keep, move or delete, with the mistake or check that justifies the verdict
    # shorts: The user-level instruction file as the personal layer (Academy claude-code-101)
    # assumes (other areas): coding-with-agents/ships-with-agent/gives-the-right-context
    # introduces: none (deepens sections and when-instructions-are-not-enough: a line stays while a mistake recurs, moves when a hook or check enforces it, and a generated draft is a list of candidates)

  # --- skills ---------------------------------------------------------------
  - id: customizing-agents/skill-or-tool-or-instruction
    title: Instruction, skill or tool?
    covers: customizing-agents/skills
    serves:
      - customizing-agents/writes-skill/chooses-skill-over-tool
    status: planned
    minutes: 10
    after:
      - customizing-agents/instructions
    # mode: explanation
    # exercise (judge): sort eight team needs into instruction, skill, tool or "the agent can already do it", and write the one-line reason next to each
    # shorts: A skill that wraps a CLI as the middle way between a CLI and a server (Academy claude-code-101)
    # assumes (other areas): concepts/recognizes-agents/names-the-loop
    # introduces: skill-vs-tool-vs-instruction
  - id: customizing-agents/first-skill
    title: Writing your first skill
    covers: customizing-agents/skills
    serves:
      - customizing-agents/writes-skill/packages-a-procedure
    status: planned
    minutes: 15
    after:
      - customizing-agents/skill-or-tool-or-instruction
    # mode: tutorial
    # exercise (do): write a skill that cuts a release of the fixture package, with the trigger in the description, the commands in order and the check that says the result is right, then run it once
    # shorts: The skill specification, field by field (Academy introduction-to-agent-skills)
    # assumes (other areas): coding-with-agents/ships-with-agent/runs-a-session
    # introduces: skill-spec, writing-a-good-skill
  - id: customizing-agents/testing-a-skill
    title: Testing a skill from a fresh session
    covers: customizing-agents/skills
    serves:
      - customizing-agents/writes-skill/packages-a-procedure
    status: planned
    minutes: 10
    after:
      - customizing-agents/first-skill
    # mode: tutorial
    # exercise (do): run the release skill from a fresh session in a clean clone, note where the agent hesitated or asked, and add the missing check or failure step
    # shorts: none
    # assumes (other areas): coding-with-agents/ships-with-agent/runs-a-session
    # introduces: none (deepens writing-a-good-skill: watch an agent use the skill on a real task and revise where it went wrong)
  - id: customizing-agents/progressive-disclosure
    title: Loading only what the skill needs
    covers: customizing-agents/skills
    serves:
      - customizing-agents/writes-skill/discloses-progressively
    status: planned
    minutes: 15
    after:
      - customizing-agents/first-skill
    # mode: tutorial
    # exercise (do): measure the release skill's token count, move the rollback procedure into a reference file the skill points to, and measure again
    # shorts: Counting the tokens a skill costs on every turn (Academy introduction-to-agent-skills)
    # assumes (other areas): concepts/explains-models/explains-generation
    # introduces: progressive-disclosure
  - id: customizing-agents/plugins
    title: Installing a plugin is installing a dependency
    covers: customizing-agents/skills
    serves:
      - customizing-agents/writes-skill/chooses-skill-over-tool
    status: planned
    minutes: 10
    after:
      - customizing-agents/first-skill
    # mode: explanation
    # exercise (judge): read the contents of one public plugin and list what it adds to the session: skills, hooks that will run, subagents, and servers with the access they ask for
    # shorts: Marketplaces and version pins for plugins (Academy claude-code-in-action)
    # assumes (other areas): coding-with-agents/verifies-agent-work/screens-for-security
    # introduces: plugins

  # --- mcp ------------------------------------------------------------------
  - id: customizing-agents/mcp
    title: Connecting an agent to your systems
    covers: customizing-agents/mcp
    serves:
      - customizing-agents/connects-tools-safely/adds-a-tool
      - customizing-agents/connects-tools-safely/weighs-tool-cost
      - customizing-agents/connects-tools-safely/hardens-a-connection
    status: live
    minutes: 20
    # mode: explanation
    # exercise (do): put a five-rule guardrail block in an agent's system prompt and test it against an injected instruction in a sandbox page
    # shorts: none
    # assumes (other areas): none beyond the in-area assumes
    # introduces: server, client, transport, mcp-primitives, mcp-vs-cli, tool-cost, mcp-security (delegated identity is the section "Whose identity does the agent act under?", which closes the #13 gap)
  - id: customizing-agents/mcp-first-server
    title: Connecting your first tool server
    covers: customizing-agents/mcp
    serves:
      - customizing-agents/connects-tools-safely/adds-a-tool
    status: planned
    minutes: 15
    after:
      - customizing-agents/mcp
    # mode: tutorial
    # exercise (do): connect a local file-system server scoped to one fixture directory, ask the agent to list and summarize its files, and read the transcript for what it called and with which arguments
    # shorts: Local and remote transports and what each one means for credentials (Academy model-context-protocol-advanced-topics)
    # assumes (other areas): concepts/recognizes-agents/names-the-loop, coding-with-agents/ships-with-agent/runs-a-session
    # introduces: none (hands-on for server, client and transport, which the live lesson introduces)
  - id: customizing-agents/mcp-tool-cost
    title: Measuring what a tool server costs
    covers: customizing-agents/mcp
    serves:
      - customizing-agents/connects-tools-safely/weighs-tool-cost
    status: planned
    minutes: 15
    after:
      - customizing-agents/mcp-first-server
    # mode: tutorial
    # exercise (judge): connect a server with many tools, read the token count of its definitions from the client, then compare one query through the server with the same query through the CLI, and record both costs in a short table
    # shorts: On-demand tool loading and why disabling unused servers is still the control (Academy claude-code-101)
    # assumes (other areas): concepts/explains-models/explains-generation
    # introduces: none (hands-on for tool-cost and mcp-vs-cli)
  - id: customizing-agents/mcp-hardening
    title: Hardening a tool connection
    covers: customizing-agents/mcp
    serves:
      - customizing-agents/connects-tools-safely/hardens-a-connection
    status: planned
    minutes: 15
    after:
      - customizing-agents/mcp-first-server
    # mode: tutorial
    # exercise (do): give the fixture server a read-only, short-lived token, turn on tool-call logging, plant an instruction in one file that asks the agent to write elsewhere, and show in the log that the write was refused or asked about
    # shorts: Tool poisoning across servers, one worked example
    # assumes (other areas): safety/judges-agent-risk/recognizes-injection, safety/judges-agent-risk/names-blast-radius
    # introduces: none (hands-on for mcp-security: scoped credentials, gated outbound abilities and a reviewed log)

  # --- hooks-permissions ----------------------------------------------------
  - id: customizing-agents/permission-modes
    title: Choosing a permission mode per task
    covers: customizing-agents/hooks-permissions
    serves:
      - customizing-agents/configures-agent/sets-permissions
    status: planned
    minutes: 15
    after:
      - customizing-agents/instructions
    # mode: tutorial
    # exercise (do): run the same small fixture task in an ask-everything mode and in an accept-edits mode, count the prompts, and write one line on which mode fits the task and why
    # shorts: Running unattended inside a sandbox or a disposable worktree (Academy claude-code-in-action)
    # assumes (other areas): safety/judges-agent-risk/names-blast-radius, coding-with-agents/ships-with-agent/runs-a-session
    # introduces: permission-modes
  - id: customizing-agents/allowlists
    title: Allowing the commands the task needs
    covers: customizing-agents/hooks-permissions
    serves:
      - customizing-agents/configures-agent/sets-permissions
    status: planned
    minutes: 15
    after:
      - customizing-agents/permission-modes
    # mode: tutorial
    # exercise (do): start from deny by default, allow the test command and the read-only version-control commands, finish the fixture task, then remove every entry the transcript shows was not used
    # shorts: How a wildcard pattern widens an allowlist beyond the command that prompted it
    # assumes (other areas): safety/judges-agent-risk/names-blast-radius
    # introduces: allowlists
  - id: customizing-agents/settings-layering
    title: Where a setting comes from
    covers: customizing-agents/hooks-permissions
    serves:
      - customizing-agents/configures-agent/sets-permissions
    status: planned
    minutes: 10
    after:
      - customizing-agents/allowlists
    # mode: explanation
    # exercise (judge): given a user file, a committed project file, a local override and a session flag that disagree, write down the effective permission set and which layer decided each entry
    # shorts: none
    # assumes (other areas): none
    # introduces: settings-layering
  - id: customizing-agents/first-hook
    title: Writing a hook that blocks a mistake
    covers: customizing-agents/hooks-permissions
    serves:
      - customizing-agents/configures-agent/adds-a-hook
    status: planned
    minutes: 15
    after:
      - customizing-agents/allowlists
    # mode: tutorial
    # exercise (do): write a pre-tool hook that rejects a commit when the lockfile changed and the manifest did not, with the message that says what to do, then make the mistake on purpose and watch it fire
    # shorts: The hook exit-code contract, and what the agent sees when a hook blocks (Academy claude-code-101)
    # assumes (other areas): coding-with-agents/verifies-agent-work/automates-the-check
    # introduces: hooks
  - id: customizing-agents/hook-or-instruction
    title: Instruction, permission or hook?
    covers: customizing-agents/hooks-permissions
    serves:
      - customizing-agents/configures-agent/adds-a-hook
      - customizing-agents/configures-agent/writes-project-instructions
    status: planned
    minutes: 10
    after:
      - customizing-agents/first-hook
    # mode: explanation
    # exercise (judge): take ten rules from a team's instruction file and sort each into stays an instruction, becomes a permission entry, or becomes a hook, then delete the instruction lines a hook now enforces
    # shorts: Hooks as approval gates in a team's delivery pipeline (Academy ai-native-sdlc-playbook)
    # assumes (other areas): safety/judges-agent-risk/chooses-human-in-loop
    # introduces: none (joins when-instructions-are-not-enough, allowlists and hooks into one decision)
  - id: customizing-agents/subagents
    title: Delegating to a subagent with narrower permissions
    covers: customizing-agents/hooks-permissions
    serves:
      - customizing-agents/configures-agent/sets-permissions
    status: planned
    minutes: 15
    after:
      - customizing-agents/allowlists
    # mode: tutorial
    # exercise (do): define a read-only reviewer subagent with its own instructions and tool set, have the main agent delegate a review of the fixture diff to it, and compare the main context before and after
    # shorts: Parallel subagents and what the parent sees of their work (Academy introduction-to-subagents)
    # assumes (other areas): safety/judges-agent-risk/names-blast-radius
    # introduces: subagents

  # --- memory ---------------------------------------------------------------
  - id: customizing-agents/memory-review
    title: Reading what the agent remembers
    covers: customizing-agents/memory
    serves:
      - customizing-agents/configures-agent/manages-memory
    status: planned
    minutes: 15
    after:
      - customizing-agents/first-skill
    # mode: tutorial
    # exercise (do): open the agent's memory notes for the fixture project, delete the two planted stale facts, and move the one fact the team should share into a context file the agent reads
    # shorts: The instruction file's import syntax for pulling context files in (Academy claude-code-101)
    # assumes (other areas): concepts/explains-models/explains-grounding
    # introduces: auto-memory, context-files
  - id: customizing-agents/compaction
    title: Directing the summary before compaction
    covers: customizing-agents/memory
    serves:
      - customizing-agents/configures-agent/manages-memory
    status: planned
    minutes: 10
    after:
      - customizing-agents/memory-review
    # mode: tutorial
    # exercise (do): run a session until it fills, ask for a summary that names open items and decisions, compact, and check which of three planted facts survived
    # shorts: Context rot in a long session, and what a compaction summary drops (Academy claude-code-101)
    # assumes (other areas): concepts/explains-models/explains-grounding
    # introduces: compaction
  - id: customizing-agents/session-handoff
    title: Handing work to the next session
    covers: customizing-agents/memory
    serves:
      - customizing-agents/configures-agent/manages-memory
    status: planned
    minutes: 15
    after:
      - customizing-agents/compaction
    # mode: tutorial
    # exercise (do): end a session with a handoff file naming state, decisions, the failing test and what was ruled out, then start a fresh session from it and count the turns until useful work resumes
    # shorts: none
    # assumes (other areas): coding-with-agents/ships-with-agent/keeps-understanding
    # introduces: session-handoff
  - id: customizing-agents/repeated-work
    title: Turning repeated work into something the agent keeps
    covers: customizing-agents/memory
    serves:
      - customizing-agents/configures-agent/manages-memory
      - customizing-agents/writes-skill/packages-a-procedure
    status: planned
    minutes: 10
    after:
      - customizing-agents/session-handoff
      - customizing-agents/hook-or-instruction
    # mode: explanation
    # exercise (judge): read three session transcripts that each work out how to regenerate the API client, and decide for each repeated step whether it becomes an instruction, a skill, a hook or a context file entry
    # shorts: none
    # assumes (other areas): none
    # introduces: turning-repeated-work-into-reusable-knowledge
