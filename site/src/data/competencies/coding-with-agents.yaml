        asks: Judge what is worth building, define success, weigh cost
        objectives: [coding-with-agents/specifies-work/judges-worth-building, coding-with-agents/specifies-work/defines-success]
      - framework: Brilliant Coding with AI
        code: SPC-3, SPC-4, SPC-6
        asks: Decompose, analyze dependencies, design verification
        objectives: [coding-with-agents/specifies-work/decomposes-into-components, coding-with-agents/specifies-work/designs-the-check]
      - framework: Ng, AI engineering skills map
