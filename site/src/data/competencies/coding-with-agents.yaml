area: coding-with-agents
competencies:
  - id: coding-with-agents/specifies-work
    statement: Specifies work well enough for an agent to implement and for anyone to verify
    topics: [coding-with-agents/specification, using-agents/decomposition]
    objectives:
      - id: coding-with-agents/specifies-work/judges-worth-building
        statement: Judges whether something should be built before building it
        level: base
        behaviors:
          - claim: The learner states the problem and who has it before proposing a change.
            why: An agent makes building cheap, which makes building the wrong thing cheap too.
            example: "\"Support answers the same question ten times a week\" comes before \"build a settings page\", and the answer may be a documentation fix."
          - claim: The learner names at least one alternative to building, including doing nothing, and says why building wins.
            why: The comparison is what turns a wish into a decision.
            example: "\"We could add the feature, change the default, or document the workaround; the workaround costs each user five minutes a week, so we change the default.\""
          - claim: The learner weighs the cost of owning the change against its value, and the cost of writing it is the smaller part.
            why: The agent writes it in an hour, and the team maintains it for years.
            example: A new dependency for one date format is rejected because it adds a package to keep patched, and a ten-line function is written instead.
      - id: coding-with-agents/specifies-work/defines-success
        statement: Defines what a successful outcome requires
        level: base
        behaviors:
          - claim: Success is written as observable outcomes that a person other than the author could check.
            why: A criterion the author has to interpret is a criterion the agent and the reviewer interpret differently.
            example: "\"Search results return within 300 ms at the 95th percentile on the test data set\" instead of \"search is fast\"."
          - claim: The criteria include what must keep working as well as what is new.
            why: An agent optimizing for the new criterion trades away anything that is not listed.
            example: "\"All existing exports still open in the finance team's spreadsheet program\" is added because the new CSV format could break them."
          - claim: The learner writes down what is out of scope.
            why: The agent fills the gap between "done" and "everything it could improve" with its own choices.
            example: "\"Not in scope: mobile layout, translations\" stops the agent from restyling the whole page."
      - id: coding-with-agents/specifies-work/decomposes-into-components
        statement: Decomposes a problem into components with clear dependencies
        level: base
        behaviors:
          - claim: Each component has one clear responsibility and an interface that fits in a sentence.
            why: Components a person can describe are components an agent can implement in isolation and a reviewer can check in isolation.
            example: "\"A parser that turns the file into records; a validator that flags bad records; a writer that saves the good ones\" rather than one \"import\" task."
          - claim: The learner draws the dependencies and orders the work so each step can be checked before the next starts.
            why: A component built on an unverified one inherits its mistakes and hides them.
            example: The parser is built and tested on real files before the validator, because the validator's tests need real parsed records.
          - claim: Each component is small enough to be one agent session and one reviewable change.
            why: A task that is too large for a session loses context halfway through, and its diff is too large to read.
            example: The learner splits "add authentication" into token issuing, token checking and the login page, and briefs each separately.
      - id: coding-with-agents/specifies-work/designs-the-check
        statement: Designs how the work will be verified before it is built
        level: base
        behaviors:
          - claim: "Before building, the learner writes down how each success criterion will be verified: which test, which measurement, which manual step."
            why: A check designed afterwards is designed around what was built, and passes by construction.
            example: For "no duplicate invoices", the check is a test that imports the same file twice and asserts one set of rows, written before the import code.
          - claim: The check is something the agent can run, so it can verify its own work before handing back.
            why: A check only a person can run is run once at the end, and a check the agent can run is run on every attempt.
            example: The acceptance test goes into the test suite and the brief says "done when `mise run test` passes".
          - claim: The learner designs at least one check that would fail if the agent took a shortcut.
            why: Agents optimize for the check they see, and a check that passes on a stub passes on a stub.
            example: The test for the email sender uses a fake mailbox and asserts the message arrived, where a check on the send function's return value would pass on a stub.
    alignment:
      - framework: Brilliant Coding with AI
        code: TAS-1..4
        asks: Judge what should be built and define success, weighing value against cost
        objectives: [coding-with-agents/specifies-work/judges-worth-building, coding-with-agents/specifies-work/defines-success]
      - framework: Brilliant Coding with AI
        code: SPC-3, SPC-4, SPC-6
        asks: Decompose, analyze dependencies, design verification
        objectives: [coding-with-agents/specifies-work/decomposes-into-components, coding-with-agents/specifies-work/designs-the-check]
      - framework: Ng, AI engineering skills map
        code: Shaping the build
        asks: Deciding what goes in the spec
        objectives: [coding-with-agents/specifies-work]
      - framework: Anthropic AI Fluency 4D
        code: Delegation
        asks: Decide what to hand to AI, which tool fits, and how much autonomy to give
        objectives: [using-agents/chooses-tool-and-autonomy/picks-chat-agent-or-automation, using-agents/chooses-tool-and-autonomy/keeps-the-human-steps, using-agents/delegates-and-checks/chooses-autonomy, coding-with-agents/specifies-work/judges-worth-building]
  - id: coding-with-agents/ships-with-agent
    statement: Ships a change with a coding agent through plan, implement and verify
    topics: [coding-with-agents/first-session, coding-with-agents/workflow, coding-with-agents/context]
    objectives:
      - id: coding-with-agents/ships-with-agent/runs-a-session
        statement: Runs a session from setup to a reviewed diff
        level: base
        behaviors:
          - claim: The learner has the agent describe the codebase and confirm the plan before it edits anything.
            why: A wrong model of the repository produces a confident change in the wrong place, and it is cheaper to correct a sentence than a diff.
            example: The learner asks "where is the config loaded and which tests cover it?" and checks the answer against the tree before saying "go ahead".
          - claim: Every session ends with the learner reading the full diff.
            why: The summary is the agent's account of what it meant to do, and the diff is what it did.
            example: The summary says "added validation", and the diff also shows a deleted test, which the learner catches and asks about.
          - claim: The learner keeps a session to one task and starts a new one when the task changes.
            why: A long session carries stale assumptions in context, and the agent keeps acting on the earlier task's constraints.
            example: After the bug fix is committed, the learner opens a fresh session for the refactor instead of typing "now also" into the same one.
      - id: coding-with-agents/ships-with-agent/works-in-increments
        statement: Works in small increments, sequenced for early feedback
        level: base
        behaviors:
          - claim: Each increment leaves the system working and adds one thing that can be shown.
            why: A working state after every step means a mistake is found in a small diff and the last good state is one step back.
            example: The learner asks for "the endpoint returning a hard-coded response first, then the real query, then the caching", and runs the app after each.
          - claim: The learner sequences increments so the riskiest assumption is tested first.
            why: Finding out on day one that the external API does not return what you expected is cheap, and on day five it is not.
            example: The integration with the payment provider is the first increment, because its behavior is the least known.
          - claim: An increment is committed when its check passes, before the next one starts.
            why: A commit per increment gives a point to return to and a diff a reviewer can read.
            example: Three small pull requests with green tests replace one large one at the end of the week.
      - id: coding-with-agents/ships-with-agent/keeps-change-reversible
        statement: Keeps every change reversible
        level: base
        behaviors:
          - claim: Every change is on a branch and in commits small enough to revert one at a time.
            why: Reverting is the cheapest fix there is, and only if the change is isolated.
            example: The learner has the agent commit after each passing increment instead of one commit at the end.
          - claim: Data and schema changes are designed with the way back written down before they run.
            why: Code reverts in a second, and a migrated table does not.
            example: The migration adds the new column and backfills it. Dropping the old column is a separate change a week later, after the code has run on the new one.
          - claim: The learner prefers a change that can be turned off to one that can only be undone.
            why: A feature flag or a configuration switch reverses in seconds and without a deploy.
            example: The new ranking algorithm ships behind a flag that is off by default, and is enabled for internal users first.
      - id: coding-with-agents/ships-with-agent/gives-the-right-context
        statement: Gives the agent the files, constraints and limits the task needs
        level: base
        behaviors:
          - claim: The learner names the files the task touches and the files it must not touch.
            why: Left to search, an agent finds the nearest plausible file, and the nearest one is often the wrong one.
            example: "\"Change the retry logic in `src/http/client.ts`; the tests are in `tests/http/`; leave `src/http/legacy/` alone\" instead of \"fix the retries\"."
          - claim: "Constraints that are not in the code are stated in the brief: style, compatibility, what must keep working."
            why: The agent cannot infer a rule it cannot see, and a project convention lives in people's heads until it is written down.
            example: The learner adds "this must stay compatible with Node 20 and must not add a dependency" because neither fact is visible in the file being edited.
          - claim: The learner gives the verification command along with the task.
            why: An agent that knows how the work will be checked runs the check itself and reports honestly against it.
            example: "\"Done when `npm test -- http` passes and the lint task is clean\" lets the agent close its own loop before handing back."
      - id: coding-with-agents/ships-with-agent/keeps-understanding
        statement: Keeps their own understanding of the code as the agent produces more of it
        level: expert
        behaviors:
          - claim: The learner can explain, without looking, how the parts the agent wrote fit into the system and why they were built that way.
            why: An engineer who cannot explain the system cannot review changes to it, and the agent's next change goes unchecked.
            example: Asked in a design review why the cache is keyed by user rather than by request, the learner answers from their own understanding without opening a transcript.
          - claim: The learner reads agent-written code with the same attention as a colleague's, and asks the agent to explain anything they do not follow.
            why: Understanding is built while reading, so skipping the reading skips the understanding.
            example: The learner stops at a regular expression they cannot parse and asks for a plain-language explanation and a test that documents it.
          - claim: The learner keeps the architecture decisions and the reasons for them in a place the agent also reads.
            why: A decision that is only in someone's head gets contradicted by the next session.
            example: The project's `docs/decisions/` folder records why the queue is in-process, and the project instructions point the agent at it.
    alignment:
      - framework: Brilliant Coding with AI
        code: INC-1, INC-2, INC-5
        asks: Working increments, early feedback, reversibility
        objectives: [coding-with-agents/ships-with-agent/works-in-increments, coding-with-agents/ships-with-agent/keeps-change-reversible]
      - framework: Brilliant Coding with AI
        code: INC-3, INC-4
        asks: Maintain understanding and coherence
        objectives: [coding-with-agents/ships-with-agent/keeps-understanding]
      - framework: Brilliant Coding with AI
        code: SPC-5, BLD-1
        asks: Manage constraints; direct an agent to a specification
        objectives: [using-agents/delegates-and-checks/writes-a-brief, coding-with-agents/ships-with-agent/gives-the-right-context]
      - framework: Ng, AI engineering skills map
        code: Using coding agents
        asks: Plan, execute, verify, monitor at calibrated autonomy
        objectives: [using-agents/delegates-and-checks, coding-with-agents/ships-with-agent]
      - framework: Anthropic AI Fluency 4D
        code: Description
        asks: State the goal, context and wanted output clearly, and refine it
        objectives: [concepts/prompts-reliably/structures-a-prompt, concepts/prompts-reliably/iterates-on-output, concepts/prompts-reliably/asks-for-structure, using-agents/delegates-and-checks/writes-a-brief, using-agents/delegates-and-checks/adjusts-mid-task, coding-with-agents/ships-with-agent/gives-the-right-context]
  - id: coding-with-agents/verifies-agent-work
    statement: Verifies agent-written code before trusting it
    topics: [coding-with-agents/verification, coding-with-agents/quality, safety/agent-risk]
    objectives:
      - id: coding-with-agents/verifies-agent-work/reviews-others-code
        statement: Reviews code they did not write, against the specification
        level: base
        behaviors:
          - claim: The review starts from the specification and asks whether the change does what was asked, before looking at how it does it.
            why: Well-written code that solves the wrong problem is the most common agent failure and the hardest to see line by line.
            example: The learner reads the brief, then the tests, then the diff, and finds the agent implemented the filter as case-sensitive where the brief said otherwise.
          - claim: The learner reads every changed file and questions changes the brief did not ask for.
            why: An agent's diff often includes "improvements" that are the riskiest part of the change.
            example: A "fix the retry" pull request also reformats two unrelated files and changes a timeout, so the learner asks for those to be dropped or split.
          - claim: The learner runs the code as well as reading it.
            why: Reading catches design problems, and running catches the behavior the tests missed.
            example: The learner checks out the branch and tries the two edge cases the brief mentioned before approving.
      - id: coding-with-agents/verifies-agent-work/observes-and-debugs
        statement: Observes the running system and isolates a fault systematically
        level: base
        behaviors:
          - claim: The learner reproduces the fault before changing anything, and writes down the steps.
            why: A fix for a fault you cannot reproduce cannot be verified, and the agent may fix something else.
            example: The learner turns a "sometimes fails" report into "fails when the file has a header row and no data" before briefing the agent.
          - claim: The learner reads the logs and traces of the running system as well as the code.
            why: The code says what should happen, and the system says what did.
            example: The stack trace shows the request never reached the handler, so the learner looks at routing rather than at the handler the agent was about to rewrite.
          - claim: "The learner narrows the fault by halving: one change, one observation, and a note of what was ruled out."
            why: Changing several things at once and hoping is how a debugging session runs for hours.
            example: The learner disables the cache, sees the bug persist, and rules out caching before letting the agent touch anything.
      - id: coding-with-agents/verifies-agent-work/automates-the-check
        statement: Turns a check into a bounded, self-checking loop
        level: base
        behaviors:
          - claim: The learner turns a manual check into a command the agent can run and read the result of.
            why: A check the agent can run is run on every iteration, and a check only the learner can run is run once.
            example: "\"Open the page and see that the table has rows\" becomes a test that renders the page and asserts on the row count."
          - claim: "The loop has a bound: a number of attempts or a time limit, after which the agent stops and reports."
            why: An agent told "keep going until the tests pass" can run forever or delete the test.
            example: The brief says "run the tests; if they fail, fix and rerun, at most five times, then stop and show me what you found".
          - claim: The learner protects the check from the agent that runs against it.
            why: The shortest path to a green check is often to change the check.
            example: The brief says the test file is read-only, and the review confirms the assertions did not change.
      - id: coding-with-agents/verifies-agent-work/screens-for-security
        statement: Screens agent output for security and supply-chain problems
        level: base
        behaviors:
          - claim: "The learner checks every new dependency the agent added: does it exist, is it the intended package, is it maintained, and is it needed."
            why: Agents suggest packages from memory, and a name that does not exist, or a look-alike package published under a misspelled name, gets installed.
            example: The diff adds a package with a slightly different name from the well-known one, so the learner checks the registry and removes it.
          - claim: The learner looks at how the change handles input, secrets and permissions, as a reviewer would for any code.
            why: Agent-written code has the same classes of vulnerability as human code, produced faster and with more confidence.
            example: The learner finds the generated query built with string formatting and asks for a parameterized one.
          - claim: The learner checks that no secret or credential ended up in the code, the tests or the transcript.
            why: An agent that read a `.env` file to solve a problem may paste its contents into a fixture.
            example: The pull request's test fixtures contain a real-looking API key, so the learner rotates it and adds the file to the secret scanner.
    alignment:
      - framework: Brilliant Coding with AI
        code: VER-2..6
        asks: Verify against spec, review, observe, debug, automate
        objectives: [coding-with-agents/verifies-agent-work/*]
      - framework: Brilliant Coding with AI
        code: SEC-3, SEC-5
        asks: Evaluate AI code for vulnerabilities; supply-chain risk
        objectives: [coding-with-agents/verifies-agent-work/screens-for-security]
      - framework: Anthropic AI Fluency 4D
        code: Discernment
        asks: Judge the output, the process and the behavior of the AI critically
        objectives: [concepts/explains-models/names-failure-modes, safety/verifies-output/checks-claims, safety/verifies-output/spots-sycophancy, safety/verifies-output/calibrates-trust, using-agents/delegates-and-checks/reviews-against-brief, coding-with-agents/verifies-agent-work/reviews-others-code]
  - id: coding-with-agents/works-in-team
    statement: Works with agents alongside a team
    topics: [coding-with-agents/team, coding-with-agents/workflow]
    objectives:
      - id: coding-with-agents/works-in-team/attributes-honestly
        statement: Attributes agent work honestly in commits and reviews
        level: base
        behaviors:
          - claim: Commits and pull requests say that an agent wrote the change, in the form the team agreed on.
            why: Reviewers read agent-written and human-written changes differently, and they need to know which one they have.
            example: The commit trailer names the agent and model, per the repository's convention, on every agent-authored commit.
          - claim: The learner takes responsibility for the change as its author, and the attribution does not shift blame to the tool.
            why: The person who submitted the change is accountable, and the tool is not.
            example: In the review the learner writes "I asked the agent for this and I checked it", instead of "the agent did this".
          - claim: The learner keeps the attribution form the project asks for, including what it forbids.
            why: Some projects need a certificate of origin only a person can sign, and an agent's sign-off is not valid.
            example: The learner adds the assisted-by trailer and leaves out `Signed-off-by` because the project says only humans certify.
      - id: coding-with-agents/works-in-team/follows-team-norms
        statement: Follows the team's review and CI norms for agent changes
        level: base
        behaviors:
          - claim: Agent-written changes go through the same review and CI gates as any other change, and the learner does not bypass them because "the agent tested it".
            why: The gates exist for changes from anyone, and an agent's tests are part of the change under review.
            example: The learner waits for CI and a reviewer's approval on the agent's pull request instead of merging it themselves.
          - claim: The learner sizes and labels agent changes so reviewers can read them.
            why: A reviewer who receives a 3000-line agent diff either skips it or blocks it.
            example: The learner splits the generated change into three pull requests and marks them as agent-assisted in the title, as the team asked.
          - claim: The learner reads and follows the team's agent instructions file before starting, and proposes changes to it instead of working around it.
            why: The file is the team's shared agreement, and a session that ignores it makes changes the team rejects.
            example: The instructions say "no new dependencies without an issue", so the learner opens the issue first.
      - id: coding-with-agents/works-in-team/runs-parallel-work
        statement: Runs several agent sessions without losing coherence
        level: expert
        behaviors:
          - claim: Each parallel session works in its own checkout or worktree on its own branch, with a task that does not overlap the others.
            why: Two agents editing the same files produce conflicts that cost more than the parallelism saved.
            example: The learner briefs one agent on the API change and another on the documentation, in two worktrees, and merges the API first.
          - claim: The learner keeps a written list of what each session is doing and what state it is in.
            why: A person can follow only one session closely at a time, and a forgotten session is a session that finished the wrong way.
            example: "A short note per session: branch, task, next check-in, and whether it is waiting on the learner."
          - claim: The learner integrates often and in a fixed order, and rebases the rest.
            why: Parallel branches drift, and the longer they live the harder they merge.
            example: Every afternoon the learner merges the finished branches into main and has the remaining sessions rebase before they continue.
          - claim: Shared resources (ports, databases, the stash, credentials) are either per session or left alone.
            why: Sessions that share a port or a stash interfere with each other without any visible conflict.
            example: The learner tells each agent not to start the dev server, because the port is shared, and to run the build instead.
      - id: coding-with-agents/works-in-team/sets-team-practice
        statement: Sets the team's practice for agent use
        level: expert
        behaviors:
          - claim: "The learner writes the team's agent practice down where the team and the agents read it: what agents may do, how work is attributed, how it is reviewed."
            why: Unwritten practice is a different practice per person, and the agents follow none of them.
            example: The repository's `AGENTS.md` says what the CI gate is, what a commit trailer looks like, and which directories agents may not touch.
          - claim: The practice starts from the mistakes the team has seen and changes when the mistakes change.
            why: A practice written from imagination guards against the wrong things.
            example: After two incidents of agents committing generated lockfiles, the team adds a hook and a line in the instructions, and removes a rule that never triggered.
          - claim: The learner makes the practice checkable by tooling where possible.
            why: A rule enforced by a hook is followed every time, and a rule in a document is followed by whoever read it.
            example: A lint hook checks the commit message format, and CI checks the attribution trailer.
    alignment:
      - framework: Brilliant Coding with AI
        code: BLD-4, BLD-5
        asks: Organize and oversee a workflow
        objectives: [coding-with-agents/works-in-team/runs-parallel-work, building-agents/orchestrates-agents/picks-a-pattern]
      - framework: Anthropic AI Fluency 4D
        code: Diligence
        asks: Use AI responsibly, transparently and with accountability for the result
        objectives: [safety/handles-data-safely/decides-what-to-share, safety/handles-data-safely/discloses-ai-use, safety/handles-data-safely/respects-licenses, safety/judges-agent-risk/names-blast-radius, safety/judges-agent-risk/chooses-human-in-loop, coding-with-agents/works-in-team/attributes-honestly]
