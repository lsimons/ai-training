area: concepts
competencies:
  - id: concepts/explains-models
    statement: Explains how a language model produces text and where it fails
    topics: [concepts/how-models-work, concepts/limits, concepts/grounding]
    objectives:
      - id: concepts/explains-models/explains-generation
        statement: Explains tokens, context and sampling in plain words
        level: base
        behaviors:
          - claim: A model produces text one token at a time, each chosen from a probability distribution over what could come next.
            why: Once the learner sees output as a chain of likely next pieces, both fluent nonsense and surprising variation stop being mysterious.
            example: Asked why the same question gave two different answers, the learner says the model picked a different likely token early on and the rest followed from it, rather than saying the model "changed its mind".
          - claim: The context window is the whole of what the model can see for one response, and anything outside it does not exist for the model.
            why: Most "it forgot" and "it ignored my file" complaints are context problems, and the fix is different from a prompting problem.
            example: When a long chat starts contradicting itself, the learner suspects earlier messages fell out of the window and restates the key facts instead of scolding the model.
          - claim: Temperature and sampling settings trade variety for predictability and do not change what the model knows.
            why: Learners otherwise reach for temperature to fix accuracy, which it cannot do.
            example: For a summary that must be the same on every run the learner asks for low temperature. For brainstorming names they raise it, and in neither case expect it to add facts.
      - id: concepts/explains-models/names-failure-modes
        statement: Names the common ways output goes wrong and why
        level: base
        behaviors:
          - claim: A hallucination is a fluent, confident statement with nothing behind it, and fluency is no signal of truth.
            why: Confident wording is exactly what the training rewards, so the learner must stop using tone as a check.
            example: Given a citation with a real-looking journal name, author and year, the learner looks it up before trusting it and is not surprised when it does not exist.
          - claim: The knowledge cutoff means the model's built-in facts stop at a date, and anything after that must be supplied or retrieved.
            why: Questions about recent events or versions get plausible but stale answers unless the learner knows to bring the facts.
            example: Asking for the current version of a library, the learner pastes the changelog or asks the tool to look it up rather than accepting the number the model recalls.
          - claim: Sycophancy is the model agreeing with the person in front of it, so the learner's own framing shapes the answer.
            why: A leading question produces a leading answer, which feels like confirmation and is not.
            example: Instead of "this plan is solid, right?" the learner asks "what are the three strongest objections to this plan?" and compares the two responses.
      - id: concepts/explains-models/explains-grounding
        statement: Explains what grounding and retrieval add and what they do not fix
        level: base
        behaviors:
          - claim: Retrieval puts relevant documents into the context window at question time, so the model answers from text it can see rather than from what it memorized.
            why: Learners otherwise expect a model "trained on our documents", and the difference decides what a stale or missing document does to the answer.
            example: When a product assistant gives an outdated price, the learner asks which document it retrieved rather than asking for the model to be retrained.
          - claim: Grounding reduces invented facts about the retrieved material but does not stop the model from misreading it or filling gaps outside it.
            why: A grounded system still produces fluent text, and a wrong summary of a real document looks the same as a right one.
            example: The learner checks the cited passage against the answer and finds the model combined two clauses from different contracts into one.
          - claim: Retrieval finds text that looks similar to the question, so a question that uses other words than the document may miss it, and keyword search misses it most often.
            why: Knowing this turns "the assistant does not know our policy" into "rephrase or fix the index", which is a fixable problem.
            example: The assistant says it has no travel policy, so the learner asks about "expense rules for trips", gets the document, and reports the naming gap.
    alignment:
      - framework: Anthropic AI Fluency 4D
        code: Discernment
        asks: Judge the output, the process and the behavior of the AI critically
        objectives: [concepts/explains-models/names-failure-modes, safety/verifies-output/checks-claims, safety/verifies-output/spots-sycophancy, safety/verifies-output/calibrates-trust, using-agents/delegates-and-checks/reviews-against-brief, coding-with-agents/verifies-agent-work/reviews-others-code]
  - id: concepts/prompts-reliably
    statement: Writes prompts that get reliable results
    topics: [concepts/prompting, concepts/how-models-work]
    objectives:
      - id: concepts/prompts-reliably/structures-a-prompt
        statement: Turns a vague request into instruction, context, example and format
        level: base
        behaviors:
          - claim: A prompt separates the instruction (what to do) from the context (what to work on) and marks the boundary between them.
            why: When instruction and material run together, the model treats parts of the material as orders or parts of the order as material.
            example: "\"Summarize the text between the triple quotes for a sales manager\" with the pasted email inside the quotes, rather than the email followed by \"summarize\"."
          - claim: The prompt names the audience and the purpose of the output.
            why: The same content for a customer and for a colleague differs in length, tone and what may be left out, and the model cannot guess which.
            example: "\"Write the release note for end users who do not read code; skip internal ticket numbers\" replaces \"write a release note\"."
          - claim: When the wanted output is hard to describe, the prompt shows one example of it.
            why: One good example fixes format, length and tone at once, where a paragraph of rules leaves room for interpretation.
            example: The learner pastes one past meeting summary in the house format and writes "produce the same for these notes".
          - claim: The prompt states the output format, including length.
            why: Left to its default, the model picks a length and format for a general reader, which is rarely what the next step needs.
            example: "\"Five bullets, each under 15 words, no introduction\" instead of \"keep it short\"."
      - id: concepts/prompts-reliably/iterates-on-output
        statement: Improves a result by changing the prompt, not by retrying
        level: base
        behaviors:
          - claim: When the output is wrong, the learner names what is wrong with it and changes the prompt to address that, instead of rerunning the same prompt.
            why: Rerunning draws another sample from the same distribution, and the same gap in the instructions produces the same class of mistake.
            example: The summary skipped the decisions made, so the learner adds "list every decision as its own line" instead of pressing regenerate.
          - claim: The learner changes one thing at a time and compares the result with the previous one.
            why: Changing five things at once shows whether the total worked and hides which change did it, so the next prompt cannot build on it.
            example: The learner first adds the audience, sees the tone fix, and only then works on the length.
          - claim: A correction the learner had to make twice moves into the prompt or into a saved template.
            why: A fix typed in the chat is gone with the session, but a fix in the prompt is there for every run.
            example: After twice asking for "dates in ISO format", the learner adds the line to the prompt they keep for the weekly report.
      - id: concepts/prompts-reliably/asks-for-structure
        statement: Asks for output in a shape the next step can use
        level: base
        behaviors:
          - claim: "The learner asks for output in the format the next step consumes: a table, a list of named fields, JSON, or a file in a known layout."
            why: Prose has to be reformatted by hand or by another prompt, and each reformatting is another place for mistakes.
            example: "For action items that go into a tracker, the learner asks for \"one line per item: owner, task, due date, separated by tabs\"."
          - claim: The requested format names its fields and the allowed values as well as its type.
            why: "\"Return JSON\" gives a different set of keys every run, and naming the keys makes runs comparable and parseable."
            example: "\"Return a JSON object with keys `sentiment` (one of positive, neutral, negative) and `reason` (one sentence)\"."
          - claim: The learner checks the first structured result against its consumer before scaling up.
            why: A format that looks right can still fail on the detail the consumer cares about, such as a date format or an empty field.
            example: The learner pastes the first generated CSV into the spreadsheet import and fixes the column order in the prompt before running the other 200 rows.
    alignment:
      - framework: Anthropic AI Fluency 4D
        code: Description
        asks: State the goal, context and wanted output clearly, and refine it
        objectives: [concepts/prompts-reliably/structures-a-prompt, concepts/prompts-reliably/iterates-on-output, concepts/prompts-reliably/asks-for-structure, using-agents/delegates-and-checks/writes-a-brief, using-agents/delegates-and-checks/adjusts-mid-task, coding-with-agents/ships-with-agent/gives-the-right-context]
  - id: concepts/recognizes-agents
    statement: Recognizes an agent, its tools and its degree of autonomy
    topics: [concepts/what-is-an-agent, concepts/limits]
    objectives:
      - id: concepts/recognizes-agents/tells-agent-from-assistant
        statement: Tells a chat assistant from an agent by what it can do unprompted
        level: base
        behaviors:
          - claim: An assistant produces text for a person to act on, and an agent takes actions through tools and decides what to do next on its own.
            why: The two need different handling, and treating an agent as a chat box means not noticing what it did.
            example: A chatbot that drafts an email is an assistant. A tool that reads the inbox, drafts replies and sends them without another prompt is an agent.
          - claim: The learner tells the difference by asking what the system can do without another prompt, whatever its interface looks like.
            why: A chat window can front an agent, and a button can trigger a plain model call, so the interface says nothing.
            example: Two products both show a chat box, and the learner asks "does it run the query itself or give me the query?" and classifies them differently.
          - claim: The learner names the tools an agent has before judging what it can do.
            why: An agent's reach is its tool list, and a research agent with a browser tool is a different risk from one with a browser and an email tool.
            example: Reading the product page, the learner lists "web search, file read, calendar write" and notes that calendar write is the one that acts on others.
      - id: concepts/recognizes-agents/places-on-autonomy-scale
        statement: Places a product or workflow on the autonomy scale
        level: base
        behaviors:
          - claim: "The learner places a workflow by who decides the next step: a person at every step, the system with approval at some steps, or the system alone."
            why: Autonomy is about who makes the decisions, and the amount of text the model produces says nothing about it.
            example: Autocomplete in an editor is low autonomy even when it writes a whole function, because the person accepts each suggestion.
          - claim: The learner can say what would move a workflow one step up or down the scale.
            why: Autonomy is a design choice, and seeing the dial makes the choice visible rather than accepting the product's default.
            example: "\"If the agent also merged the pull request instead of opening it, it would move from supervised to autonomous.\""
          - claim: The learner places the same product differently depending on how it is configured.
            why: Most agent products have permission settings, and the setting decides the autonomy.
            example: A coding agent in "ask before each edit" mode and the same agent in "auto-accept" mode go on different points of the scale.
      - id: concepts/recognizes-agents/names-the-loop
        statement: Describes the observe, think, act loop and the tools in it
        level: base
        behaviors:
          - claim: "The learner describes the loop as: the agent observes (reads a result), thinks (decides the next step), acts (calls a tool), and repeats until it decides it is done."
            why: Naming the loop makes the agent's behavior predictable and points at where a step can go wrong.
            example: Watching a coding agent, the learner narrates "it ran the tests, read the failure, and now it is editing the file".
          - claim: The learner can name which tools were used in a given run and what each observation was.
            why: A tool call is where the agent touches the world, so the tool list is the list of things that can have side effects.
            example: From a transcript the learner lists "searched the web twice, read one file, wrote one file" and notes the write is the step to check.
          - claim: The learner knows the loop ends either because the agent decides it is done or because a limit stops it, and can tell which happened.
            why: "\"Stopped because the budget ran out\" and \"stopped because it is finished\" need different follow-up."
            example: An agent that ends with a half-written file and no summary hit a limit, so the learner checks the log rather than trusting the output.
    alignment: []
