area: customizing-agents
competencies:
  - id: customizing-agents/configures-agent
    statement: Configures an agent for a project
    topics: [customizing-agents/instructions, customizing-agents/hooks-permissions, customizing-agents/memory]
    objectives:
      - id: customizing-agents/configures-agent/writes-project-instructions
        statement: Writes instructions that remove a recurring agent mistake
        level: base
        behaviors:
          - claim: Each instruction is traceable to a mistake the agent made in a real session.
            why: Instructions written from imagination pad the file, dilute the ones that matter and are never tested.
            example: After the agent ran `npm install` twice against a pinned lockfile, the learner adds "install with `npm ci`, never `npm install`" and nothing else that day.
          - claim: An instruction says what to do and how the agent can tell it did it, in one or two lines.
            why: Vague guidance such as "write clean code" gives the agent nothing to check itself against.
            example: "\"Run `mise run ci` before reporting done; it must exit 0\" replaces \"make sure everything works\"."
          - claim: The learner removes an instruction when the mistake stops recurring or when a hook or a check now enforces it.
            why: A project file that only grows gets skimmed, and the rules that still matter get lost in it.
            example: Once a pre-commit hook rejects unformatted files, the learner deletes the "always run the formatter" line from the instructions.
      - id: customizing-agents/configures-agent/sets-permissions
        statement: Sets permissions to the least the work needs
        level: base
        behaviors:
          - claim: The learner starts from deny by default and allows the specific commands and paths the task needs.
            why: A broad allowlist granted for convenience is the blast radius of every later mistake.
            example: The settings allow `npm test` and `git diff` without asking, and everything else prompts.
          - claim: The learner separates what the agent may read from what it may write and run.
            why: Reading is nearly always safe, and writing and running are where damage happens.
            example: The agent may read the whole repository but may write only under `src/` and `tests/`.
          - claim: The learner reviews the permission set after a task and removes what was not used.
            why: Permissions accumulate and are never removed on their own.
            example: After the migration is done, the learner removes the database CLI from the allowlist.
      - id: customizing-agents/configures-agent/adds-a-hook
        statement: Adds a hook that enforces a rule the instructions cannot
        level: base
        behaviors:
          - claim: The learner reaches for a hook when a rule must hold every time, and for an instruction when it is guidance.
            why: An instruction is read and sometimes ignored, but a hook runs whether or not the model remembered.
            example: "\"Run the formatter before committing\" becomes a pre-commit hook after the third unformatted commit."
          - claim: A hook fails loudly and says what to do, and it runs fast enough that nobody disables it.
            why: A silent hook is a mystery to the agent and a slow hook is a hook someone turns off.
            example: The hook prints "lockfile changed but the manifest did not; run `bun install` or revert" and exits non-zero in under a second.
          - claim: The learner tests the hook by making the mistake it is meant to catch.
            why: A hook that has never fired may not work, and the first real mistake is a bad time to find out.
            example: The learner writes a commit with the forbidden pattern and checks that the hook rejects it, before relying on it.
      - id: customizing-agents/configures-agent/manages-memory
        statement: Manages what the agent carries between sessions
        level: expert
        behaviors:
          - claim: The learner decides what the agent should carry between sessions and puts it in a file the agent reads, rather than relying on automatic memory.
            why: Automatic memory keeps what the tool thought was important, and a file keeps what the team decided was.
            example: The project's context file records "the staging database is read-only for agents" so no session has to relearn it.
          - claim: The learner reviews what the agent has remembered and deletes what is stale or wrong.
            why: A wrong remembered fact is applied to every future session with full confidence.
            example: The memory file still says the tests take ten minutes. After the test speed-up, the learner removes the line so the agent stops skipping them.
          - claim: "When a session's work continues later, the learner has the agent write a handoff: state, decisions, what is left."
            why: Context does not survive the session, and the next session otherwise reconstructs it from the diff, badly.
            example: The session ends with a `HANDOFF.md` that names the failing test and the two approaches already ruled out.
          - claim: The learner turns a fix that sessions had to make more than once into a skill or an instruction.
            why: Repeated work in memory is a symptom, and the cure is a reusable procedure.
            example: After three sessions each worked out how to regenerate the API client, the steps become a skill.
    alignment:
      - framework: Brilliant Coding with AI
        code: MEM-1, MEM-2
        asks: Manage memory; turn repeated work into reusable knowledge
        objectives: [customizing-agents/configures-agent/manages-memory, customizing-agents/writes-skill/packages-a-procedure]
  - id: customizing-agents/writes-skill
    statement: Writes a reusable agent skill
    topics: [customizing-agents/skills, customizing-agents/instructions]
    objectives:
      - id: customizing-agents/writes-skill/chooses-skill-over-tool
        statement: Chooses between a skill, a tool and an instruction for a need
        level: base
        behaviors:
          - claim: The learner picks an instruction for a rule, a skill for a procedure, and a tool for an ability the agent does not have.
            why: Each does one thing, and a rule written as a skill or a procedure written as an instruction fails in a predictable way.
            example: "\"Always use `bun`, never `npm`\" is an instruction. \"How to cut a release\" is a skill, and \"query the issue tracker\" is a tool."
          - claim: The learner asks whether the agent can already do the task with what it has before adding anything.
            why: A skill that wraps a command the agent already knows adds context and no ability.
            example: The agent can run `gh pr create` unaided, so the skill only records the team's PR template and review steps.
          - claim: The learner weighs what each option costs the context window and the permission set.
            why: Every tool and every loaded skill takes tokens on every turn, and a tool adds to what the agent can do wrong.
            example: A read-only MCP server with forty tools is replaced by a CLI the agent calls when needed.
      - id: customizing-agents/writes-skill/packages-a-procedure
        statement: Packages a repeatable procedure as a skill another person's agent can use
        level: base
        behaviors:
          - claim: The skill states when to use it, the steps, and how to tell the result is right.
            why: Another person's agent has none of the author's context and needs all three to run the procedure without asking.
            example: A release skill says "use when asked to cut a release", lists the six commands in order, and ends with "the tag exists and CI on the tag is green".
          - claim: The skill is tested by running it from a fresh session on someone else's machine.
            why: A procedure that only works with the author's setup is not reusable.
            example: A colleague's agent runs the skill and stops at a missing environment variable, so the skill gains a check for it.
          - claim: The skill names the commands and files exactly, and says what to do when a step fails.
            why: A procedure that assumes success stops at the first surprise.
            example: "\"If `mise run ci` fails, fix the reported task and rerun; do not skip the task\" is part of the skill."
      - id: customizing-agents/writes-skill/discloses-progressively
        statement: Structures a skill so the agent loads only what it needs
        level: base
        behaviors:
          - claim: The skill's front matter says in one or two lines what it is for, so the agent can decide whether to load it without reading it.
            why: Every skill's description is in context on every turn, and a long one is paid for on every turn.
            example: The description is "Cut and publish a release of this package" and nothing more.
          - claim: The main skill file holds the common path, and rare cases, long references and templates go into files the skill points to.
            why: A skill that loads everything up front costs the context of the rare case on every run.
            example: The release skill's body is forty lines, and the rollback procedure is in `rollback.md`, loaded only when needed.
          - claim: The learner measures what the skill costs when loaded and trims it when it grows.
            why: Skills grow by accretion, and no single addition looks expensive.
            example: The learner counts the tokens of the skill directory after each change and moves a bloated table into a script.
    alignment:
      - framework: Brilliant Coding with AI
        code: MEM-1, MEM-2
        asks: Manage memory; turn repeated work into reusable knowledge
        objectives: [customizing-agents/configures-agent/manages-memory, customizing-agents/writes-skill/packages-a-procedure]
  - id: customizing-agents/connects-tools-safely
    statement: Connects an agent to tools and data safely
    topics: [customizing-agents/mcp, customizing-agents/hooks-permissions, safety/agent-risk]
    objectives:
      - id: customizing-agents/connects-tools-safely/adds-a-tool
        statement: Adds a tool via MCP or CLI with least privilege
        level: base
        behaviors:
          - claim: The learner adds the smallest tool that does the job, with read-only access where the task is read-only.
            why: A tool's permissions are what the agent, or an injected instruction, can do with it.
            example: The issue tracker is connected with a token that can read and comment and cannot close or delete.
          - claim: The learner picks between an MCP server and a CLI by what the agent needs and what each costs.
            why: An MCP server's tool list is in context on every turn, and a CLI is called only when used and needs a shell.
            example: For two occasional queries the learner uses the CLI. For a tool the agent calls constantly with structured input, they use an MCP server.
          - claim: The tool is added with a test task and the transcript is read before it is used on real work.
            why: The first use shows what the agent thinks the tool does, which may differ from what it does.
            example: The learner asks the agent to "list open issues" and sees it call the tool with the wrong filter, then fixes the description.
      - id: customizing-agents/connects-tools-safely/weighs-tool-cost
        statement: Explains the token and risk cost of a tool before adding it
        level: base
        behaviors:
          - claim: Before adding a tool, the learner can say how many tokens its definitions take and on how many turns they are paid.
            why: Tool definitions travel with every request, and a tool used once costs on every turn it is present.
            example: The learner measures that a server's forty tool schemas add several thousand tokens per turn and keeps only the three tools the task uses.
          - claim: The learner names what the tool lets the agent do that it could not before, and what an injected instruction could do with it.
            why: A tool's risk is its abilities in the wrong hands, and any web page the agent reads can hold an injected instruction.
            example: A tool that posts to chat is what turns a read-only summarizer into an exfiltration path, so it is added only where posting is the task.
          - claim: The learner compares the tool against the alternative of no tool.
            why: Many tools wrap something the agent could read from a file or a command.
            example: Instead of a documentation MCP server, the docs are checked into the repository and the agent reads them.
      - id: customizing-agents/connects-tools-safely/hardens-a-connection
        statement: Hardens a tool connection against injection and exfiltration
        level: expert
        behaviors:
          - claim: The learner treats every tool result as untrusted input to the model, and designs the connection assuming a result will one day contain instructions.
            why: Anything the tool reads from the world can carry an injected instruction, and the model cannot tell.
            example: The web-fetch tool strips scripts and marks its output as "content from the page", and the agent's sensitive tools require approval when a fetch happened in the same turn.
          - claim: Outbound abilities are gated or removed on any agent that reads untrusted content.
            why: Exfiltration is read plus send, and the send is the part you can control.
            example: The research agent has fetch and file-write, and no email or chat tool, and file-write is confined to one directory.
          - claim: Credentials given to a tool are scoped, short-lived and separate from the person's own.
            why: A leaked agent token should cost one revocation and nothing more.
            example: The MCP server runs with a service account that can read one project's issues, and the token expires daily.
          - claim: The learner logs tool calls and their arguments and reviews them for the tool's first weeks.
            why: Injection shows up as a call that made no sense for the task, and only a log shows it.
            example: The log shows the agent tried to fetch a URL containing a file's contents, and the learner traces it to a planted comment in a README.
    alignment:
      - framework: Brilliant Coding with AI
        code: SEC-4
        asks: Mitigate AI- and agent-specific risks
        objectives: [building-agents/runs-in-production/mitigates-agent-risks, customizing-agents/connects-tools-safely/hardens-a-connection]
