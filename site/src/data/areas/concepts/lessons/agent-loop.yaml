id: concepts/agent-loop
title: Watch a tiny agent work
description: >-
  Read the transcript of a toy agent that lists a folder and reads a note, name each turn as observe,
  think or act, see how a tool is described to the model, and learn the ways the loop ends.
mode: tutorial
covers: concepts/what-is-an-agent
serves: [concepts/recognizes-agents/names-the-loop]
introduces: [tool, agent-loop]
assumes: []
extends-to:
  - label: Building your first agent
    href: /building-agents/agent-loop/
after: [concepts/iterating-on-a-prompt, concepts/thin-path]
shorts: [how a tool is described to the model]
exercise:
  kind: do
  brief: >-
    Read the third transcript of the toy agent (a scripted model with two tools), and list each turn
    as observe, think or act with the tool it used.
sources: [AEC-01, DLAI-11, Academy claude-platform-101]
issue: 140
minutes: 15
notes: >-
  Foundations page, so the learner runs nothing. The toy loop is
  site/examples/concepts/agent-loop/tiny_agent.py, a scripted model with two tools (list_dir,
  read_file) over three committed notes. The page shows its three transcripts (find, count, limit)
  in text fences, pasted from its output. No test wires the fixture to the page yet, because how a
  hidden fixture backs a foundations page in CI is decided in #237. The engineering version with the code
  is building-agents/agent-loop, linked from extends-to. The pitfall's half-written file is prose
  about an agent with a write tool, which the toy doesn't have. AEC-01 is cited for ideas in our own
  words, so NOTICE.md gets no new entry.
