id: building-agents/stopping-the-loop
title: Stopping the loop on purpose
description: >-
  Give the agent loop every reason it needs to stop, run three fake models that never answer, and
  name the rule that ended each run.
mode: tutorial
covers: building-agents/agent-loop
serves: [building-agents/builds-agent-loop/implements-the-loop]
introduces: [stop-conditions, unbounded-loop-pitfalls]
assumes: []
after: [building-agents/agent-loop, building-agents/tool-errors]
shorts: [Ways a loop runs away]
exercise:
  kind: do
  brief: >-
    Change the repeated-round check in the fixture loop to compare with every earlier round, so a
    fake model that alternates between two fixes stops with `repeated_state` instead of hitting the
    step limit. The output is the shorter trace.
sources:
  - AEC-06
  - AEC-13
  - Claude docs handling-stop-reasons
sources-checked: 2026-09-23
minutes: 15
notes: >-
  The live lesson has one step limit. This lesson gives the full set of stop rules and a fake model
  that never answers, retries a failing tool forever, and alternates two fixes. Predict which rule
  fires and what the run returns.
