id: building-agents/retrieval-as-a-tool
title: Retrieval as a tool the agent calls
mode: tutorial
covers: building-agents/retrieval-memory
serves: [building-agents/builds-agent-loop/adds-retrieval]
introduces: [when-basic-rag-suffices, agentic-rag-loop]
assumes:
  - objective: concepts/explains-models/explains-grounding
after: [building-agents/stopping-the-loop]
shorts: [Chunking and indexes]
exercise:
  kind: do
  brief: >-
    Add a question with no answer in the fixture corpus to the small test set, and change the
    retrieval prompt so the fake agent answers `not found` for it instead of inventing a policy. The
    output is the test set results before and after.
sources: [Academy claude-platform-101]
issue: 198
minutes: 15
notes: >-
  Basic retrieval first: a fake search over a twelve-document corpus, top matches in the prompt,
  answer. Then one multi-hop question it fails, and a bounded loop that reformulates. Predict which
  questions the basic version answers. The Academy's just-in-time loading pattern is the same idea
  for a real agent (Academy claude-platform-101).
