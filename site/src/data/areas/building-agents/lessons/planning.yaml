id: building-agents/planning
title: Writing the plan before taking the steps
description: >-
  Have the fake model write a numbered plan before any tool runs, work through it, and see a stale
  plan send a false email until the model revisits the plan after each step.
mode: tutorial
covers: building-agents/patterns
serves: [building-agents/orchestrates-agents/picks-a-pattern]
introduces: [planning]
assumes:
  - objective: building-agents/builds-agent-loop/implements-the-loop
    lesson: building-agents/agent-loop
    section: the-loop
after: [building-agents/react]
shorts: []
exercise:
  kind: do
  brief: >-
    Make the fixture planner revise its list when step three returns a surprise, instead of running
    the stale step four. The output is the plan before and after the revision.
sources:
  - AEC-06
  - AEC-04
  - Wang 2023
  - Claude Code permission modes
  - Claude Code tools reference
sources-checked: 2026-09-25
review-by: 2027-03-25
minutes: 15
notes: >-
  The fake model writes a step list, works through it and updates it. Predict the plan after a step
  reveals a new fact. The fixture in site/examples/building-agents/planning/agent.py reuses the
  shop of the react lesson with three new tools. The surprise in the lesson is a kettle out of
  stock, and the exercise's surprise is a recalled toaster, which the lesson's reviser has no rule
  for. The plan-then-execute versus reactive trade-off is left to plan-or-react, and this lesson
  only compares the call counts of follow and work. Academy building-with-the-claude-api from the
  plan was dropped because the page cites no claim from it. The planned Order checkpoint on the
  moves of a planning round was replaced in review by a Choice on when to correct the plan, so that
  each first checkpoint has a review alternate on the same idea: the Predict and the stale-plan
  Choice, the which-task Choice and the Sort, the when-to-correct Choice and the Scenario.
