id: building-agents/orchestrating-agents
title: Orchestration in code or by a model
mode: tutorial
covers: building-agents/orchestration
serves:
  - building-agents/orchestrates-agents/justifies-orchestration-cost
  - building-agents/orchestrates-agents/composes-patterns
introduces: [code-vs-model-driven-orchestration, sequential-hierarchical-collaborative]
assumes: []
after: [building-agents/plan-or-react]
shorts: [Subagents with fresh context]
exercise:
  kind: do
  brief: >-
    Inject a fault at each boundary of the fixture's manager-and-workers arrangement (an empty plan
    from the manager, a tool error from a worker) and make the orchestrator stop and report. The
    output is the two traces.
sources: [Academy claude-platform-101, Academy introduction-to-subagents]
issue: 209
minutes: 15
notes: >-
  A sequential pipeline written in code, then a manager fake model that delegates to two workers as
  tools. Predict the handoff messages and which agent runs when in each arrangement. The token
  comparison waits for the next lesson (Academy introduction-to-subagents, Academy claude-platform-101).
