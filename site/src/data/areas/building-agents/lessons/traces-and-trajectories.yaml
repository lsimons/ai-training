id: building-agents/traces-and-trajectories
title: Recording and grading the path the agent took
description: >-
  Give an invoice assistant's loop a trace of every model and tool call, grade two runs with the same
  answer by the path they took, write the expected path for a lookup as a rule, and read two
  transcripts the scores passed.
mode: tutorial
covers: building-agents/evaluation
serves: [building-agents/evaluates-agents/grades-trajectories]
introduces: [observability, trajectory-evaluation]
assumes:
  - objective: coding-with-agents/verifies-agent-work/observes-and-debugs
    lesson: coding-with-agents/observing-and-debugging
    section: read-what-the-system-recorded
after: [building-agents/golden-sets]
shorts: [Trace formats and tracing tools]
exercise:
  kind: do
  brief: >-
    Write the expected-path rule for the fixture's lookup task (search once and first, look up payments
    only on the account the search returned, no other tool, at most three tool calls, end with an
    answer) as a function over the trace, run it over the fixture's eight runs and list which fail and
    why.
sources: [AEC-09, OpenTelemetry GenAI spans]
issue: 202
minutes: 15
sources-checked: 2026-09-25
review-by: 2027-03-25
notes: >-
  The fixture loop in site/examples/building-agents/traces-and-trajectories/ writes a trace with one
  record per model call and per tool call, with latency from fixed numbers and a fixed formula and
  cost from made-up prices, so the output is deterministic. A fake model can't wander, so each of the
  eight runs has its own scripted model and the tools are real functions over a small data table. The
  invoice data, the account numbers and the eight paths are illustrative, written by the author. Run
  r2 is the competency file's example (the payment lookup called three times with the wrong account).
  The expected path in words (section three) is this course's rule for the lookup task, so it cites
  AEC-09 only for what a trajectory check looks at. The OpenTelemetry GenAI span conventions page backs
  the span names, the token attributes, the development status and the opt-in content capture, and
  is why the lesson sets review-by. Brilliant VER and Academy building-with-the-claude-api from the
  plan were dropped because the page cites no claim from them. The short on trace formats and
  tracing tools is still to write.
