notes: >-
  The content the live lesson leaves out on purpose: one full request (system prompt, tool
  definitions with a JSON schema, message list) and one full response, then the tool result message
  and the second request that carries the whole history again. Shows how the fake model's `tool` and
  `answer` keys map onto the request block, its id and the stop reason (Academy building-with-the-claude-api, Academy claude-platform-101). The N x M problem closes the lesson
  and sets up agent-protocols (Academy introduction-to-model-context-protocol). Until the live
  lesson page gains an `assumes` that points here, both lessons render at the top row, because a
  live entry takes its place from its page. The live lesson's follow-up issue should add it.
