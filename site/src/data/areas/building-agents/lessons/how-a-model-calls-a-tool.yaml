exercise:
  kind: judge
  brief: >-
    Given the live lesson's fake model reply `{"tool": "get_weather", "args": {"city": "Lisbon"}}`
    and the tool's result, write the three real API messages they become (the tool request block
    with its id, the tool result message that quotes that id, and the final text reply), then mark
    which field plays the role of the fake model's `answer` key.
