  - safety/judges-agent-risk/names-blast-radius
  - safety/judges-agent-risk/chooses-human-in-loop
  - safety/judges-agent-risk/recognizes-injection
introduces:
  - blast-radius
  - permissions-and-least-privilege
  - human-in-the-loop
  - prompt-injection
  - exfiltration
assumes:
  - objective: concepts/explains-models/names-failure-modes
    lesson: concepts/how-models-work
    section: failure-modes-named
  - objective: safety/verifies-output/calibrates-trust
    lesson: safety/bias-in-patterns
    section: how-much-checking-a-screening-task-gets
extends-to:
  - label: Introduction to the EU AI Act
    href: /safety/eu-ai-act/
after: []
shorts:
  - Agents that are only saved prompts
  - Permission modes (spec S02, extends-to)
exercise:
  kind: do
  brief: >-
    Describe one agent task, list its reach, and place the approval before the irreversible step.
sources: []
