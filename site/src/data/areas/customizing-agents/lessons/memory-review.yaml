id: customizing-agents/memory-review
title: Reading what the agent remembers
description: >-
  Read the auto-memory notes a coding agent keeps for a project, delete the two that have gone
  stale, and move a team fact into a context file that the instruction file imports.
mode: tutorial
covers: customizing-agents/memory
serves: [customizing-agents/configures-agent/manages-memory]
introduces: [auto-memory, context-files]
assumes:
  - objective: concepts/explains-models/explains-grounding
    lesson: concepts/memory
    section: where-products-keep-the-notes
sources-checked: 2026-09-25
review-by: 2027-03-25
after: [customizing-agents/first-skill]
shorts:
  - The instruction file's import syntax for pulling context files in (Academy claude-code-101)
exercise:
  kind: do
  brief: >-
    Open the agent's memory notes for the fixture project, delete the two planted stale facts, and
    move the one fact the team should share into a context file the agent reads.
sources:
