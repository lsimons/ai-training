issue: 189
minutes: 15
notes: >-
  The planted notes are `site/examples/customizing-agents/memory-review/notes/`, which the learner
  copies to `~/memory-review-notes` and loads with `claude --settings` and `autoMemoryDirectory`, so
  their own memory folders stay untouched. The two stale notes are checkable in the fixture copy:
  `git branch --list done-v2` prints nothing and `grep -c todos.json test_todo.py` prints 0. The
  import example project is `imports/` next to them, and `imports.py` applies the vendor's import
  rules to it (relative to the importing file, code spans skipped, recursive). Memory folder location,
  the MEMORY.md index and topic files, the four note types, the 200-line or 25KB load limit, topic
  files read on demand, `/memory`, `/context` and the `@path` rules come from
  code.claude.com/docs/en/memory. The load limit is also on code.claude.com/docs/en/context-window.
  `autoMemoryDirectory` with `--settings` and the `~/` form is from the memory page, and `--settings`
  lasting one session and writing no file is from code.claude.com/docs/en/settings. The learner edits
  `~/memory-review-notes` directly, because no page says the `/memory` folder option follows
  `autoMemoryDirectory`. The import depth limit is not quoted, because only the memory
  page states it. The prompt response is illustrative and the page says so.
