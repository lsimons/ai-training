id: using-agents/drafting-and-critique
title: Drafting a text and asking for critique
description: >-
  Brief a chat assistant for a short email and check every fact in the draft, then ask for
  critique of it as a colleague's text against criteria you wrote first, and get problems in place
  of praise.
mode: tutorial
covers: using-agents/assistant-work
serves:
  - using-agents/delegates-and-checks/writes-a-brief
  - using-agents/delegates-and-checks/reviews-against-brief
introduces: [drafting, critique]
assumes:
  - objective: concepts/prompts-reliably/structures-a-prompt
    lesson: concepts/prompt-anatomy
    section: audience-and-purpose
  - objective: safety/verifies-output/spots-sycophancy
    lesson: safety/asking-a-model-to-disagree
    section: habits-on-the-prompt-side
extends-to:
  - label: Delegating a task to an agent
    href: /using-agents/delegating/
after: [using-agents/thought-partner]
shorts: [Grading against stated criteria]
exercise:
  kind: do
  brief: >-
    Brief the assistant for a short email (audience, purpose, two points that must appear, tone,
    length) with two or three done-criteria, and mark every fact in the draft as from the brief, a
    placeholder or added by the model. Then paste the draft into a fresh chat as a colleague's text
    with those criteria, and ask for problems only, pass or fail per criterion.
sources: [Sharma 2023]
issue: 142
minutes: 15
notes: >-
  The plan listed DLAI-3 and two Claude Academy courses as sources. The page makes no claim that
  needs them, so it cites only Sharma 2023, whose feedback-sycophancy experiment (section 3.1) found
  more positive feedback when the user says they wrote or like a text and more negative feedback
  when they say they did not write it. That is the basis for calling the text a colleague's, and
  the page says the framing leans the critique harsh, so the learner judges each finding. The
  fresh chat keeps the earlier praise and the draft request out of what the model reads. The critique criteria are the done-criteria of the drafting brief, which
  ties writes-a-brief ("done-criteria are written before the work starts") to reviews-against-brief
  (walking the criteria one by one). No fixture: the learner uses a chat tool, and every exchange
  is illustrative. The example email names no company or person.
