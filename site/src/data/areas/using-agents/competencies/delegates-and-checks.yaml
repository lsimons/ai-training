id: using-agents/delegates-and-checks
area: using-agents
statement: Delegates a task to an agent and checks the result
topics: [using-agents/delegating, using-agents/decomposition, using-agents/assistant-work]
objectives:
  - id: using-agents/delegates-and-checks/writes-a-brief
    statement: Writes a brief with goal, context, limits and done-criteria
    level: base
    behaviors:
      - claim: A brief states the goal, the context the work needs and the limits it must stay within.
        why: An agent fills in whatever is left unsaid with plausible defaults, so what it must not touch
          matters as much as what it must do.
        example: '"Update the pricing table in `docs/pricing.md` from this spreadsheet; do not change any
          other file" stays on task, where "update the pricing" may rewrite the page.'
      - claim: Done-criteria are written before the work starts.
        why: Without them the result is judged by feel, and a plausible result is accepted as a correct one.
        example: '"Done when every row in the spreadsheet appears once in the table and the totals match"
          turns review into a check rather than a read.'
      - claim: The brief names the information the agent should use and where it is.
        why: An agent that has to guess sources picks the most available one, which is rarely the right one.
        example: Pointing at the approved spreadsheet, not "the latest numbers", prevents the agent from
          pulling last quarter's figures from an old email.
  - id: using-agents/delegates-and-checks/chooses-autonomy
    statement: Chooses how much the agent may do before checking in
    level: base
    behaviors:
      - claim: The learner sets the check-in point from the cost of a wrong step, however much they trust
          the tool.
        why: Trust built on a few good runs does not lower the cost of the one bad run.
        example: For a summary of meeting notes the agent may finish unattended. For replies to customers it
          stops before each send, even though it has drafted well before.
      - claim: A first run of a new kind of task is done with more check-ins than later runs of the same
          task.
        why: The first run shows where the agent's defaults differ from the learner's, and that is when the
          brief gets fixed.
        example: The first time the agent files expense reports the learner reviews each one. After the
          brief has been corrected twice, they review a sample.
      - claim: The learner can state in one sentence what the agent may do without asking and what it must
          ask about.
        why: If the boundary cannot be said plainly, it has not been chosen and the agent will choose it.
        example: '"Edit anything under `drafts/`, ask before touching anything else, never send" is a
          boundary, and "be careful" is not.'
  - id: using-agents/delegates-and-checks/reviews-against-brief
    statement: Reviews the result against the brief, not against a feeling
    level: base
    behaviors:
      - claim: The review walks the done-criteria one by one and records pass or fail for each.
        why: A result that reads well is accepted by feel, and a checklist catches the criterion the agent
          skipped.
        example: The brief said "every row appears once and totals match", so the learner counts rows and
          adds the totals instead of skimming the table.
      - claim: The review checks the limits as well as the goal, looking for what the agent did that it was
          not asked to do.
        why: An agent that finishes the task and also "improves" three other things has broken the brief
          even if the task is done.
        example: The learner opens the list of changed files and questions the two files that the brief did
          not mention.
      - claim: A result that fails review sends the learner back to the brief before it sends them back to
          the agent.
        why: Most misses are something the brief left unsaid, and re-running the same brief reproduces the
          miss.
        example: The agent used last year's template, so the learner adds "use the template in
          `templates/2026/`" to the brief and runs again instead of typing "no, the new one".
  - id: using-agents/delegates-and-checks/adjusts-mid-task
    statement: Adjusts the brief when the work reveals new information
    level: base
    behaviors:
      - claim: When the agent reports something the brief did not anticipate, the learner updates the brief
          rather than answering the question in the chat.
        why: An answer in the chat is lost to the next run, but a brief that holds the new information keeps
          the fix.
        example: The agent asks which of two templates to use, so the learner adds "use `templates/2026/`"
          to the brief and restarts from it.
      - claim: The learner stops the agent when the work shows the goal itself was wrong, instead of letting
          it finish the wrong thing well.
        why: Finished wrong work costs the run and the review, and a stopped run costs only the run.
        example: The agent's first draft shows the data is quarterly instead of monthly, so the learner
          stops and rewrites the done-criteria.
      - claim: A change to the brief is stated as a change, so the agent drops the old constraint.
        why: An agent holds the earlier instruction in context and tries to satisfy both.
        example: '"Replace the earlier limit of five bullets with: no limit, one bullet per decision" rather
          than only stating the new rule.'
