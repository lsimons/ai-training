minutes: 15
notes: >-
  Issue #18, low priority, so it sits late in the course. It covers first-session because that topic
  owns `sandbox` and `trust boundary` (issue #13; the area is at its seven-topic cap). The network
  allowlist that the #65 Academy pass names is taught here, cited as Academy claude-code-in-action
  (trusting unsupervised runs, paraphrased).
