id: coding-with-agents/security-review
title: Reading agent code as if the input were hostile
description: >-
  Run a static analyzer over an agent-written search function, find the string-built query it
  reports and the swallowed error it misses, and brief the agent for a parameterized fix with a test.
mode: tutorial
covers: coding-with-agents/quality
serves: [coding-with-agents/verifies-agent-work/screens-for-security]
introduces: [security-review-of-agent-output]
assumes:
  - objective: safety/judges-agent-risk/names-blast-radius
    lesson: safety/agent-risk
    section: blast-radius
  - objective: safety/judges-agent-risk/recognizes-injection
    lesson: safety/agent-risk
    section: prompt-injection-when-the-data-gives-orders
after: [coding-with-agents/tests-and-docs-that-hold]
shorts: [the classic mistakes agents copy from their training data]
exercise:
  kind: do
  brief: >-
    Read a recorded static analyzer run over an agent-written fixture change, find the string-built
    query it reports and the swallowed error it misses, and brief the agent for the parameterized
    version with a test that fails on the old code. Running the analyzer yourself is the stretch goal.
sources: [Academy claude-code-in-action, Brilliant SEC, Pearce 2022, Bandit, Bandit PyPI, Python sqlite3]
issue: 178
minutes: 15
sources-checked: 2026-09-25
review-by: 2027-03-25
notes: >-
  Sources: Brilliant SEC-3, Academy claude-code-in-action (paraphrased). S03 says no lesson asks for a
  pip install and the course's Python floor is 3.9, while Bandit 1.9.4 needs Python 3.10 or newer, so
  the page shows a recorded Bandit run and running Bandit is the stretch goal. Whether an
  engineering lesson may install a pinned tool is https://github.com/lsimons/ai-training/issues/461. Both pasted outputs were produced on
  2026-09-25 with Bandit 1.9.4 on Python 3.13.15, from a fresh copy of
  site/examples/coding-with-agents/security-review/, by `uvx --python 3.13 bandit@1.9.4 -q
  notes_search.py` (exit status 1, the page drops the start line and the summary) and `uvx --python
  3.13 bandit@1.9.4 -q fixed/notes_search.py` (no output, exit status 0). Re-run both when the review
  date comes.
