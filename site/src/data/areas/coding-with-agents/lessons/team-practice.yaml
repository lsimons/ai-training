id: coding-with-agents/team-practice
title: Writing down how the team uses agents
description: >-
  Write the team's practice for agent use into the project instructions file, starting from the
  incidents in the project's history, take out the rule no incident supports, and decide which
  agreements a hook or a CI check also enforces.
mode: explanation
covers: coding-with-agents/team
serves: [coding-with-agents/works-in-team/sets-team-practice]
introduces: []
assumes:
  - objective: coding-with-agents/ships-with-agent/gives-the-right-context
    lesson: coding-with-agents/project-instructions
    section: the-file-the-agent-reads-first
  - objective: coding-with-agents/works-in-team/attributes-honestly
    lesson: coding-with-agents/attribution-and-review-norms
    section: the-sign-off-only-a-person-gives
  - objective: coding-with-agents/works-in-team/follows-team-norms
    lesson: coding-with-agents/ci-and-hooks
    section: run-the-gates-in-ci
  - objective: coding-with-agents/works-in-team/runs-parallel-work
    lesson: coding-with-agents/parallel-sessions
    section: know-what-the-worktrees-share
after: [coding-with-agents/parallel-sessions, coding-with-agents/attribution-and-review-norms]
shorts: []
exercise:
  kind: judge
  brief: >-
    From three incidents in the fixture's history, write the practice section of an agent
    instructions file and drop the rule no incident supports.
sources:
