# Lychee link checker configuration
# https://lychee.cli.rs/usage/config/

# Root-relative internal links (/guides/getting-started/, /diagram.png) resolve
# against our published site, so they land under the excluded lsimons.github.io
# domain below — lychee never checks them. `starlight-links-validator`, wired
# into `docs/astro.config.mjs`, is what validates internal links, and it fails
# `mise run docs-build` when one is dead. lychee's job here is external URLs
# only.
base_url = "https://lsimons.github.io/lsimons-template-doc/"

# 429 (rate limited) and 403 (bot-protected) are not broken links; accept them
# so the pre-commit hook does not flake on external hosts.
accept = ["100..=299", "403", "429"]

# - Our own published URL: the deploy workflow proves it, and checking it is a
#   chicken-and-egg problem on the first deploy (and internal links resolve
#   against it, see base_url above).
# - localhost: dev-server URLs are not reachable in CI.
# - linkedin: bot-protected, returns 403/999 to checkers.
# - `[{}]` / `%7B`: JSX expressions in .mdx that lychee mis-parses as URLs.
exclude = [
  '^https?://lsimons\.github\.io/',
  '^http://localhost',
  '^https://www\.linkedin\.com',
  '[{}]',
  '%7[BD]',
]
