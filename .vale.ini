StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = ai-training

# Pinned release, not `@latest`: an upstream change must never arrive by
# auto-download. Fetched by `mise run prose-sync`; the result is gitignored.
Packages = https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip

# Vale has no "only new content" mode; MinAlertLevel is the whole gate and
# `mise run prose` decides what fails (errors) and what only prints
# (warnings).
[*.{md,mdx}]
BasedOnStyles = Vale

# Named individually rather than adding the whole `write-good` style, which
# enables this one without pulling in the package's other eight rules.
# `write-good.Passive` lives in .vale-extended.ini (`mise run prose-extended`)
# because it flags far more idiom than genuine passive voice; run it every so
# often and fix the sentences that hide who does what.
write-good.Cliches = YES

# The topic, competency and bibliography data. Vale reads YAML as plain
# text (keys included), so spelling is the useful check here; the passive
# and cliche rules are noise on short definitions and titles.
[*.{yaml,yml}]
BasedOnStyles = Vale
