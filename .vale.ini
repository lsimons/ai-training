StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = ai-training

# Pinned release, not `@latest`: an upstream change must never arrive by
# auto-download. Fetched by `mise run prose-sync`; the result is gitignored.
Packages = https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/vale-cli/Readability/releases/download/v0.1.1/Readability.zip, \
  https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

# Vale has no "only new content" mode; MinAlertLevel is the whole gate and
# `mise run prose` decides what fails (errors) and what only prints
# (warnings).
[*.{md,mdx}]
BasedOnStyles = Vale, House
# Spelling belongs to cspell (`mise run spell`, American English), so Vale's
# built-in check is off. Vale.Terms stays: it enforces the casing of the
# plain-word names in the accept list.
Vale.Spelling = NO


# Named individually rather than adding the whole `write-good` style. Which
# rule goes where, and why, is decided rule by rule in docs/prose/README.md
# from the reports under docs/prose/reports/.
#
# A doubled word ("the the") is a typo every time, so this one gates.
write-good.Illusions = error
# Rare here and nearly always worth a rewrite.
write-good.Cliches = YES
write-good.Weasel = YES
# Ships as `error`; here it advises. Most hits are "There is no X", which
# is fine; the rule is for the flabby opener.
write-good.ThereIs = warning
# Nine of its tokens are domain vocabulary here (objective, evaluate, ...)
# and are exempted through the accept list, which Vale applies to every
# rule with exceptions. What remains is worth reading.
write-good.TooWordy = YES
# `write-good.Passive` and `write-good.So` live in .vale-extended.ini
# (`mise run prose-extended`): too much idiom for every run.

# proselint, decided rule by rule in docs/prose/README.md. All zero hits
# today; the point is the tripwire. Named individually because the package
# ships nearly everything at `error` and Vale has no per-style level.
#
# A hit is a defect every time: annotations left in text, slurs, "!!",
# "PIN number", oxymorons, non-words, "12 a.m.".
proselint.Annotations = error
proselint.Cursing = error
proselint.LGBTOffensive = error
proselint.Hyperbole = error
proselint.RASSyndrome = error
proselint.Oxymorons = error
proselint.Malapropisms = error
proselint.Nonwords = error
proselint.DateCase = error
proselint.DateMidnight = error
proselint.DateRedundancy = error
proselint.DateSpacing = error
# A hit deserves a look but may be deliberate.
proselint.GenderBias = warning
proselint.LGBTTerms = warning
proselint.DenizenLabels = warning
proselint.GroupTerms = warning
proselint.CorporateSpeak = warning
proselint.Airlinese = warning
proselint.Jargon = warning
proselint.Archaisms = warning
proselint.Skunked = warning
proselint.Hedging = warning
proselint.Apologizing = warning
proselint.Currency = warning
# Off: Typography (the `...` in quoted UI strings mirrors the screen),
# Cliches and Very (write-good already covers them), Spelling (a
# British-to-American swap list, not a spell check; a real spell checker
# handles that), Diacritical, P-Value, AnimalLabels, and Uncomparables,
# which crashes Vale 3.20.0 when a match spans a line break. Needless and
# But live in .vale-extended.ini.

# Google, decided rule by rule in docs/prose/README.md. Most of the package
# is house style for reference documentation; what runs here is the part the
# project adopted (present tense, contractions, the Oxford comma, sentence
# case headings) plus the tripwires. The project's own House style holds the
# one rule Google has backwards for this repository: punctuation goes
# outside quotation marks, so a quoted prompt never seems to end in a comma.
#
# A hit is a defect every time: "3pm", slash dates, a spaced dash, "he/she",
# "A.B.C.", a period ending a heading, "tl;dr".
Google.AMPM = error
Google.DateFormat = error
Google.EmDash = error
Google.Gender = error
Google.Periods = error
Google.HeadingPunctuation = error
Google.Slang = error
# Adopted house style, advisory. Present tense over "will"; contractions;
# the Oxford comma; sentence-case headings (proper nouns and codes that may
# stay capitalized go in accept.txt, which this rule honors); "for example"
# over "e.g."; no "currently" or "latest" (they rot); no "!" in teaching
# text; no "(s)".
Google.Will = warning
Google.Contractions = warning
Google.OxfordComma = warning
Google.Headings = warning
Google.Latin = warning
Google.Timeless = warning
Google.Exclamation = warning
Google.OptionalPlurals = warning
House.Quotes = warning
# Off: Passive (identical to write-good.Passive hit for hit), Quotes (the
# American convention; House.Quotes is the project's), Parens, Colons,
# WordList, WordListCase, Ellipses, Anthropomorphism (labels, product
# vocabulary and quoted templates), Spacing and LyHyphens (every hit a false
# positive: "DeepLearning.AI", "supply-chain"), GenderBias and Jargon
# (proselint's run already), Spelling (cspell's job). We, FirstPerson,
# Semicolons, ExcessiveClaims, Units, Ordinal and Ranges live in
# .vale-extended.ini.

# ai-tells (tbhb/vale-ai-tells), decided rule by rule in docs/prose/README.md.
# The package ships all 137 rules at `error`; here each is named with its
# own level. 74 rules had zero hits, and the ones below that name a phrase
# a person never types are tripwires: an unspaced dash, "--" in prose,
# "I hope this helps", "In today's fast-paced", "In conclusion", "Let's
# unpack", "despite these challenges", "The result? ...", "rich tapestry",
# "nestled in", "cannot be overstated", and the listicle headings.
ai-tells.EmDashUsage = error
ai-tells.DoubleHyphen = error
ai-tells.ClosingPleasantries = error
ai-tells.OpeningCliches = error
ai-tells.ConclusionMarkers = error
ai-tells.UnpackExplore = error
ai-tells.DespiteChallenges = error
ai-tells.RhetoricalSelfAnswer = error
ai-tells.AICompoundPhrases = error
ai-tells.PromotionalPuffery = error
ai-tells.UrgencyInflation = error
ai-tells.WrapUpHeadings = error
ai-tells.MarketingHeadings = error
ai-tells.AnnouncementHeadings = error
ai-tells.ListIntroductions = error
# Zero hits today; a hit deserves a look but may be deliberate.
ai-tells.RestatementMarkers = warning
ai-tells.HollowAcknowledgment = warning
ai-tells.ResonateOveruse = warning
ai-tells.StrategyBuzzwords = warning
ai-tells.AIAdjectiveNounPairs = warning
ai-tells.AbsoluteAssertions = warning
ai-tells.VagueAttributions = warning
ai-tells.DefensiveHedges = warning
ai-tells.FalseBalance = warning
ai-tells.FalseExclusivity = warning
ai-tells.IncompleteComparison = warning
ai-tells.StrawmanContrast = warning
ai-tells.RedundantPrecaution = warning
ai-tells.StackedHedges = warning
ai-tells.NegatedPair = warning
ai-tells.UniversalObject = warning
ai-tells.OverusedVocabularyVerbs = warning
ai-tells.MicDropHeadings = warning
ai-tells.NarrativePivots = warning
ai-tells.SummativeAppositive = warning
ai-tells.RhetoricalDevices = warning
ai-tells.EmptyPaddingStacked = warning
ai-tells.NamedAdjective = warning
ai-tells.NominalizedScopeChange = warning
ai-tells.OrganicConsequence = warning
ai-tells.ParticipialPadding = warning
ai-tells.ScopePartition = warning
ai-tells.ServesAsDodge = warning
ai-tells.ShellNounCopula = warning
ai-tells.UnderRegime = warning
# Fired, and the hits were fixed (or quote source material): "lives in" for
# "is stored in", "delve"/"robust"/"dynamically", "remember that", "tends
# to". Rare enough to keep on every run.
ai-tells.FigurativeLives = warning
ai-tells.OverusedVocabulary = warning
ai-tells.SelfReference = warning
ai-tells.FillerPhrases = warning
ai-tells.StructureAnnouncements = warning
# Off: the rules that flag this project's own vocabulary or conventions.
# AnthropomorphicCognition (34 of 42 hits are "teaches"; a lesson teaches),
# ShipOveruse (Ship is a development phase here), BareNames and BareReaches
# ("names what an action can reach" is a learning objective), LabelAndExplain
# ("The rule: ..." closes every Pitfall, per spec S03), FormalTransitions
# ("for example" is what Google.Latin prescribes), FormalRegister (10 of 12
# hits are "implement", software vocabulary), HouseStyle (the project's own
# style is named House), EnforcementMetaphors ("gate" is the CI vocabulary),
# FigurativeDraws ("Draws on topics" is a spec column), FigurativeKeeps
# ("keep it short"), BareHolds (the YAML calls it the loudest rule and says
# to disable it where the container sense is kept), ExplainerHeadings
# ("Where a rule can go" is the right heading), AffirmativeFormulas and
# SequencingMarkers (both fire on "The first lesson", the project's noun),
# VerbTricolon and VerbTricolonDensity (over half the matches are noun
# lists after a colon, or the first three of four items), ColonUsage (the
# specs' "**Purpose:**" label, product names; Google.Colons is off for the
# same reason). The figurative family, the negation and rhythm rules,
# SemicolonUsage and CataphoricForecasting live in .vale-extended.ini.

# The topic, competency and bibliography data. Vale reads YAML as plain
# text (keys included); the style rules are noise on short definitions and
# titles, so only the base style (term casing) runs. cspell spells it.
# Readability: seven whole-file scores that agree with each other at 0.89 or
# better, so one is enough. Flesch-Kincaid grade, threshold 8 (set inside the
# package), lessons only: that is the material with a reader whose time the
# score measures. On the plan notes it fires on every file forever. One
# alert per file at line 1; find the long sentences yourself, or run
# `mise run prose-metrics -- Readability` for every file's score.
[site/src/content/docs/**/*.{md,mdx}]
Readability.FleschKincaid = warning
# Acronyms asks each file to spell out an acronym once, "Term (ACR)".
# Lessons only: the plan notes and specs are full of codes that are not
# acronyms. The ones this audience reads without help are exempted in
# accept.txt; MCP, RAG and LLM are deliberately not, so the lesson that
# introduces them defines them.
Google.Acronyms = warning

[*.{yaml,yml}]
BasedOnStyles = Vale
Vale.Spelling = NO
