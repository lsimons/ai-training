StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = ai-training

# Pinned release, not `@latest`: an upstream change must never arrive by
# auto-download. Fetched by `mise run prose-sync`; the result is gitignored.
Packages = https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip

# Vale has no "only new content" mode; MinAlertLevel is the whole gate and
# `mise run prose` decides what fails (errors) and what only prints
# (warnings).
[*.{md,mdx}]
BasedOnStyles = Vale

# Named individually rather than adding the whole `write-good` style. Which
# rule goes where, and why, is decided rule by rule in docs/prose/README.md
# from the reports under docs/prose/reports/.
#
# A doubled word ("the the") is a typo every time, so this one gates.
write-good.Illusions = error
# Rare here and nearly always worth a rewrite.
write-good.Cliches = YES
write-good.Weasel = YES
# Ships as `error`; here it advises. Most hits are "There is no X", which
# is fine; the rule is for the flabby opener.
write-good.ThereIs = warning
# Nine of its tokens are domain vocabulary here (objective, evaluate, ...)
# and are exempted through the accept list, which Vale applies to every
# rule with exceptions. What remains is worth reading.
write-good.TooWordy = YES
# `write-good.Passive` and `write-good.So` live in .vale-extended.ini
# (`mise run prose-extended`): too much idiom for every run.

# proselint, decided rule by rule in docs/prose/README.md. All zero hits
# today; the point is the tripwire. Named individually because the package
# ships nearly everything at `error` and Vale has no per-style level.
#
# A hit is a defect every time: annotations left in text, slurs, "!!",
# "PIN number", oxymorons, non-words, "12 a.m.".
proselint.Annotations = error
proselint.Cursing = error
proselint.LGBTOffensive = error
proselint.Hyperbole = error
proselint.RASSyndrome = error
proselint.Oxymorons = error
proselint.Malapropisms = error
proselint.Nonwords = error
proselint.DateCase = error
proselint.DateMidnight = error
proselint.DateRedundancy = error
proselint.DateSpacing = error
# A hit deserves a look but may be deliberate.
proselint.GenderBias = warning
proselint.LGBTTerms = warning
proselint.DenizenLabels = warning
proselint.GroupTerms = warning
proselint.CorporateSpeak = warning
proselint.Airlinese = warning
proselint.Jargon = warning
proselint.Archaisms = warning
proselint.Skunked = warning
proselint.Hedging = warning
proselint.Apologizing = warning
proselint.Currency = warning
# Off: Typography (the `...` in quoted UI strings mirrors the screen),
# Cliches and Very (write-good already covers them), Spelling (a
# British-to-American swap list, not a spell check; a real spell checker
# handles that), Diacritical, P-Value, AnimalLabels, and Uncomparables,
# which crashes Vale 3.20.0 when a match spans a line break. Needless and
# But live in .vale-extended.ini.

# The topic, competency and bibliography data. Vale reads YAML as plain
# text (keys included), so spelling is the useful check here; the passive
# and cliche rules are noise on short definitions and titles.
[*.{yaml,yml}]
BasedOnStyles = Vale
