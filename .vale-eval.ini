# Evaluation config for `mise run prose-eval`: enables every rule of the
# package under review so its report can be inspected and each rule sent to
# .vale.ini, .vale-extended.ini or left off. Not a lint gate; see
# docs/prose/README.md for the process and the decisions it produced.
StylesPath = .vale/styles
# The package's own levels are uneven (write-good ships `error`,
# `warning` and `suggestion`), so show everything and let the report count.
MinAlertLevel = suggestion
Vocab = ai-training

Packages = https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/vale-cli/Readability/releases/download/v0.1.1/Readability.zip, \
  https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.{md,mdx}]
# Whole package, not individual rules: the point is to see all of them.
BasedOnStyles = Vale, House, write-good, proselint, Readability, Google, ai-tells
# Spelling belongs to cspell (`mise run spell`, American English), so Vale's
# built-in check is off. Vale.Terms stays: it enforces the casing of the
# plain-word names in the accept list.
Vale.Spelling = NO
# Crashes Vale 3.20.0 ("index out of range", exit 2) when its two-word
# match spans a line break, e.g. "most\ncomplete" in a wrapped paragraph.
# Reproduce: printf 'the most\ncomplete\n' > t.md; vale t.md with the rule on.
proselint.Uncomparables = NO

[*.{yaml,yml}]
BasedOnStyles = Vale
Vale.Spelling = NO
