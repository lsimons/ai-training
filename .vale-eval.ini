# Evaluation config for `mise run prose-eval`: enables every rule of the
# package under review so its report can be inspected and each rule sent to
# .vale.ini, .vale-extended.ini or left off. Not a lint gate; see
# docs/prose/README.md for the process and the decisions it produced.
StylesPath = .vale/styles
# The package's own levels are uneven (write-good ships `error`,
# `warning` and `suggestion`), so show everything and let the report count.
MinAlertLevel = suggestion
Vocab = ai-training

Packages = https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip

[*.{md,mdx}]
# Whole package, not individual rules: the point is to see all of them.
BasedOnStyles = Vale, write-good

[*.{yaml,yml}]
BasedOnStyles = Vale
